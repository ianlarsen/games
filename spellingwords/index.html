<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Mobile Spelling Quest</title>
  <style>
    :root {
      --ink: #243047;
      --muted: #667085;
      --purple: #6254e7;
      --purple-dark: #4638c5;
      --purple-soft: #eceafe;
      --gold: #ffca5c;
      --mint: #55d6a2;
      --coral: #ff7c78;
      --paper: rgba(255, 255, 255, 0.96);
      --shadow: 0 18px 50px rgba(54, 44, 126, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 202, 92, 0.72) 0 7%, transparent 7.4%),
        radial-gradient(circle at 88% 16%, rgba(85, 214, 162, 0.45) 0 8%, transparent 8.4%),
        linear-gradient(155deg, #f7f0ff 0%, #e9f8ff 48%, #fff8dc 100%);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible,
    input:focus-visible,
    [tabindex="0"]:focus-visible {
      outline: 4px solid rgba(98, 84, 231, 0.3);
      outline-offset: 3px;
    }

    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      max-width: 760px;
      margin: 0 auto;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .sparkles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      color: rgba(98, 84, 231, 0.16);
      font-size: clamp(22px, 6vw, 42px);
      animation: float 7s ease-in-out infinite;
    }

    .sparkle:nth-child(1) { left: 4%; top: 30%; }
    .sparkle:nth-child(2) { right: 5%; top: 42%; animation-delay: -2s; }
    .sparkle:nth-child(3) { left: 10%; bottom: 8%; animation-delay: -4s; }
    .sparkle:nth-child(4) { right: 8%; bottom: 10%; animation-delay: -1s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-14px) rotate(8deg); }
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 50px;
      margin-bottom: 14px;
    }

    .topbar.hidden {
      display: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-right: auto;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 14px;
      color: white;
      background: linear-gradient(145deg, #7467f0, #4b3ac8);
      box-shadow: 0 8px 18px rgba(76, 59, 201, 0.25);
    }

    .level-pill {
      display: none;
      min-height: 42px;
      align-items: center;
      padding: 8px 13px;
      border-radius: 999px;
      color: var(--purple-dark);
      font-size: 0.88rem;
      font-weight: 900;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 18px rgba(54, 44, 126, 0.08);
    }

    .level-pill.visible {
      display: flex;
    }

    .level-pill::after {
      margin-left: 3px;
      content: "▾";
      font-size: 0.72rem;
    }

    .start-levels {
      display: grid;
      gap: 12px;
      width: min(100%, 390px);
      margin: 22px auto 0;
    }

    .level-choice-button {
      display: flex;
      min-height: 66px;
      align-items: center;
      gap: 14px;
      padding: 11px 18px;
      border: 3px solid #dedafc;
      border-radius: 18px;
      color: var(--ink);
      text-align: left;
      background: #f8f7ff;
      box-shadow: 0 5px 0 #dedafc;
    }

    .level-choice-button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #dedafc;
    }

    .level-choice-number {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-weight: 950;
      background: var(--purple);
    }

    .level-choice-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-weight: 950;
    }

    .level-choice-copy small {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 750;
    }

    .level-switcher-backdrop {
      position: fixed;
      z-index: 300;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      background: rgba(36, 48, 71, 0.52);
      backdrop-filter: blur(8px);
    }

    .level-switcher {
      width: min(100%, 430px);
      padding: 24px;
      border-radius: 26px;
      background: white;
      box-shadow: 0 24px 70px rgba(25, 20, 70, 0.3);
    }

    .level-switcher h2 {
      margin-bottom: 17px;
      text-align: center;
    }

    .close-level-switcher {
      width: 100%;
      min-height: 48px;
      margin-top: 16px;
      border-radius: 15px;
      color: var(--purple-dark);
      font-weight: 900;
      background: var(--purple-soft);
    }

    .screen {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1;
      flex-direction: column;
    }

    .card {
      width: 100%;
      margin: auto 0;
      padding: clamp(22px, 5vw, 38px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 30px;
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero {
      text-align: center;
    }

    .hero-orbit {
      position: relative;
      display: grid;
      width: 140px;
      height: 140px;
      margin: 2px auto 18px;
      place-items: center;
      border-radius: 50%;
      font-size: 70px;
      background: linear-gradient(145deg, #fff5c9, #ffe18a);
      box-shadow: inset 0 -8px 0 rgba(240, 170, 45, 0.13), 0 16px 30px rgba(240, 170, 45, 0.2);
      animation: hero-bob 3s ease-in-out infinite;
    }

    .hero-orbit::before,
    .hero-orbit::after {
      position: absolute;
      content: "★";
      color: var(--purple);
      font-size: 26px;
    }

    .hero-orbit::before { left: -13px; top: 14px; transform: rotate(-18deg); }
    .hero-orbit::after { right: -11px; bottom: 12px; transform: rotate(15deg) scale(0.7); }

    @keyframes hero-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(2rem, 8vw, 3.5rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    h2 {
      margin-bottom: 10px;
      font-size: clamp(1.55rem, 5.8vw, 2.4rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .subtitle {
      max-width: 470px;
      margin-right: auto;
      margin-bottom: 24px;
      margin-left: auto;
      color: var(--muted);
      font-size: clamp(1rem, 3.8vw, 1.2rem);
      line-height: 1.5;
    }

    .primary-button,
    .secondary-button {
      display: inline-flex;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px 24px;
      border-radius: 18px;
      font-weight: 900;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .primary-button {
      color: white;
      background: linear-gradient(145deg, #7062ef, #4b3ac8);
      box-shadow: 0 10px 0 #392ba0, 0 17px 28px rgba(76, 59, 201, 0.24);
    }

    .primary-button:active {
      transform: translateY(5px);
      box-shadow: 0 5px 0 #392ba0, 0 10px 20px rgba(76, 59, 201, 0.2);
    }

    .secondary-button {
      color: var(--purple-dark);
      background: var(--purple-soft);
    }

    .secondary-button:active {
      transform: scale(0.97);
    }

    .wide-button {
      width: min(100%, 360px);
    }

    .resume-note {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .progress-wrap {
      margin-bottom: 22px;
    }

    .progress-copy {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 850;
    }

    .progress-track {
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #ececf4;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mint), #36bad5);
      transition: width 350ms cubic-bezier(.2, .8, .2, 1);
    }

    .round-card {
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding: clamp(19px, 4.8vw, 34px);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--purple);
      font-size: 0.82rem;
      font-weight: 950;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .helper {
      margin-bottom: 20px;
      color: var(--muted);
      line-height: 1.45;
    }

    .sentence {
      margin: 10px 0 26px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.42rem, 5.4vw, 2rem);
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
    }

    .drop-zone {
      display: inline-flex;
      min-width: 108px;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      margin: 0 4px;
      padding: 2px 12px;
      border: 3px dashed #9e95ee;
      border-radius: 14px;
      color: var(--purple-dark);
      font-family: ui-rounded, system-ui, sans-serif;
      font-size: 1.03rem;
      vertical-align: middle;
      background: var(--purple-soft);
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
    }

    .drop-zone.ready {
      border-style: solid;
      background: #ddd9ff;
      transform: scale(1.04);
    }

    .drop-zone.drag-over {
      border-color: #2fa879;
      background: #dff9ef;
      transform: scale(1.08);
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 4px;
    }

    .word-choice {
      display: flex;
      min-height: 92px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 5px;
      border: 3px solid transparent;
      border-radius: 20px;
      color: var(--ink);
      background: #f6f5ff;
      box-shadow: 0 6px 0 #dfdcf7;
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .word-choice .emoji {
      font-size: clamp(1.7rem, 7vw, 2.35rem);
      line-height: 1;
      pointer-events: none;
    }

    .word-choice .word {
      overflow: hidden;
      max-width: 100%;
      font-size: clamp(0.84rem, 3.4vw, 1.08rem);
      font-weight: 900;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .word-choice.selected {
      border-color: var(--purple);
      background: #ece9ff;
      box-shadow: 0 6px 0 #b8b0ed;
      transform: translateY(-3px);
    }

    .drag-ghost {
      position: fixed;
      z-index: 99;
      display: flex;
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(-2deg);
      opacity: 0.93;
      border: 3px solid var(--purple);
      border-radius: 18px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--ink);
      font-weight: 900;
      background: white;
      box-shadow: 0 18px 35px rgba(54, 44, 126, 0.25);
      transition: transform 100ms ease, background 100ms ease;
    }

    .drag-ghost.snapped {
      transform: translate(-50%, -50%) scale(1.02);
      background: #dff9ef;
    }

    .audio-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0 18px;
    }

    .emoji-bubble {
      display: grid;
      width: 92px;
      height: 92px;
      margin-bottom: 14px;
      place-items: center;
      border-radius: 28px;
      font-size: 50px;
      background: linear-gradient(145deg, #fff4bc, #ffe18a);
      box-shadow: inset 0 -6px 0 rgba(220, 160, 42, 0.12);
    }

    .sound-button {
      display: inline-flex;
      min-width: 168px;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 12px 22px;
      border: 3px solid #d9d5fb;
      border-radius: 999px;
      color: var(--purple-dark);
      font-weight: 900;
      background: #f8f7ff;
    }

    .sound-button:active {
      transform: scale(0.97);
    }

    .play-icon {
      display: inline-block;
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 15px solid currentColor;
    }

    .tricky-badge {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      margin-top: 10px;
      padding: 6px 11px;
      border-radius: 999px;
      color: #8b4b00;
      font-size: 0.78rem;
      font-weight: 950;
      background: #fff0b5;
    }

    .slots-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      gap: clamp(4px, 1.7vw, 9px);
      width: 100%;
      margin: 6px auto 22px;
      cursor: text;
    }

    .letter-slot {
      display: grid;
      width: clamp(34px, 10vw, 52px);
      height: clamp(50px, 13vw, 68px);
      place-items: center;
      border-bottom: 5px solid #9389e7;
      border-radius: 10px 10px 4px 4px;
      font-size: clamp(1.5rem, 7vw, 2.15rem);
      font-weight: 950;
      text-transform: lowercase;
      background: #f8f7ff;
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }

    .letter-slot.selected {
      border-color: var(--purple);
      background: var(--purple-soft);
      box-shadow: 0 0 0 4px rgba(98, 84, 231, 0.2);
      transform: translateY(-3px);
    }

    .letter-slot.correct {
      border-color: #218b63;
      color: #0d6243;
      background: #c9f3df;
      box-shadow: inset 0 -4px 0 rgba(22, 123, 86, 0.12);
    }

    .letter-slot.misplaced {
      border-color: #d49a20;
      color: #7a4b00;
      background: #ffecad;
      box-shadow: inset 0 -4px 0 rgba(160, 105, 0, 0.12);
      cursor: grab;
      touch-action: none;
    }

    .letter-slot.misplaced:active {
      cursor: grabbing;
    }

    .letter-slot.drag-over {
      border-color: var(--purple);
      background: #ddd9ff;
      transform: scale(1.08);
    }

    .letter-drag-ghost {
      position: fixed;
      z-index: 101;
      display: grid;
      pointer-events: none;
      place-items: center;
      border: 3px solid #d49a20;
      border-radius: 12px;
      color: #7a4b00;
      font-size: 2rem;
      font-weight: 950;
      text-transform: lowercase;
      background: #ffecad;
      box-shadow: 0 16px 30px rgba(54, 44, 126, 0.25);
      transform: translate(-50%, -50%) rotate(-5deg) scale(1.05);
      transition: transform 100ms ease, background 100ms ease;
    }

    .letter-drag-ghost.snapped {
      transform: translate(-50%, -50%) scale(1.02);
      background: #ddd9ff;
    }

    .typing-capture {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      border: 0;
      color: transparent;
      font-size: 16px;
      background: transparent;
      caret-color: transparent;
    }

    .plain-input {
      display: block;
      width: min(100%, 390px);
      min-height: 68px;
      margin: 8px auto 22px;
      padding: 10px 18px;
      border: 3px solid #c9c4f6;
      border-radius: 18px;
      color: var(--ink);
      font-size: clamp(1.3rem, 6vw, 2rem);
      font-weight: 900;
      text-align: center;
      text-transform: lowercase;
      background: #fbfaff;
      caret-color: var(--purple);
    }

    .plain-input:focus {
      border-color: var(--purple);
    }

    .action-row {
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }

    .feedback {
      min-height: 30px;
      margin: 12px 0 0;
      color: var(--muted);
      font-weight: 850;
      text-align: center;
    }

    .feedback.good { color: #167b56; }
    .feedback.try { color: #b64f47; }

    .correction-backdrop {
      position: fixed;
      z-index: 350;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      background: rgba(36, 48, 71, 0.58);
      backdrop-filter: blur(8px);
    }

    .correction-dialog {
      width: min(100%, 430px);
      padding: clamp(24px, 6vw, 36px);
      border-radius: 28px;
      text-align: center;
      background: white;
      box-shadow: 0 24px 70px rgba(25, 20, 70, 0.32);
      animation: pop 300ms cubic-bezier(.2, 1.2, .5, 1);
    }

    .correction-word {
      margin: 22px 0 28px;
      color: var(--ink);
      font-size: clamp(2.3rem, 13vw, 4rem);
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }

    .corrected-letter {
      color: var(--purple-dark);
      font-weight: 950;
      text-decoration: underline;
      text-decoration-thickness: 0.12em;
      text-underline-offset: 0.14em;
    }

    .shake {
      animation: shake 320ms ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-4px); }
    }

    .success-panel,
    .level-panel {
      text-align: center;
    }

    .success-emoji {
      display: block;
      margin-bottom: 12px;
      font-size: clamp(4.5rem, 19vw, 7rem);
      animation: pop 500ms cubic-bezier(.2, 1.45, .5, 1);
    }

    @keyframes pop {
      from { transform: scale(0.2) rotate(-12deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }

    .stars-earned {
      margin: 15px 0 24px;
      color: #efad28;
      font-size: 2.2rem;
      letter-spacing: 5px;
    }

    .level-map {
      display: grid;
      gap: 10px;
      margin: 22px 0 26px;
      text-align: left;
    }

    .map-step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      color: var(--muted);
      background: #f4f3fa;
    }

    .map-step.done,
    .map-step.current {
      color: var(--ink);
      font-weight: 850;
    }

    .map-step.current {
      background: var(--purple-soft);
    }

    .map-number {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: #aaa4c5;
    }

    .done .map-number { background: #2dab7b; }
    .current .map-number { background: var(--purple); }

    .confetti {
      position: fixed;
      z-index: 100;
      top: -20px;
      width: 11px;
      height: 18px;
      border-radius: 3px;
      pointer-events: none;
      animation: fall 2.4s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translate3d(var(--drift), 110vh, 0) rotate(720deg);
        opacity: 0.9;
      }
    }

    @media (max-height: 720px) {
      .topbar { margin-bottom: 8px; }
      .round-card { padding-top: 16px; padding-bottom: 16px; }
      .progress-wrap { margin-bottom: 12px; }
      .sentence { margin-top: 4px; margin-bottom: 15px; }
      .word-choice { min-height: 76px; }
      .audio-stage { margin-top: 0; margin-bottom: 10px; }
      .emoji-bubble { width: 72px; height: 72px; margin-bottom: 8px; font-size: 40px; }
    }

    @media (max-width: 390px) {
      .app { padding-right: 12px; padding-left: 12px; }
      .choices { gap: 7px; }
      .word-choice { min-height: 82px; border-radius: 16px; }
      .brand-text { display: none; }
      .level-pill { font-size: 0.8rem; }
    }

    @media (orientation: landscape) {
      .is-ipad .app::after {
        position: fixed;
        z-index: 200;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 30px;
        content: "Turn your iPad upright for the best spelling adventure.";
        color: var(--ink);
        font-size: 1.45rem;
        font-weight: 900;
        text-align: center;
        background: linear-gradient(155deg, #f7f0ff, #e9f8ff);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="sparkles" aria-hidden="true">
    <span class="sparkle">✦</span>
    <span class="sparkle">✎</span>
    <span class="sparkle">★</span>
    <span class="sparkle">✦</span>
  </div>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">Aa</span>
        <span class="brand-text">Spelling Quest</span>
      </div>
      <button class="level-pill" id="levelPill" type="button" aria-label="Change level" aria-haspopup="dialog"></button>
    </header>
    <section class="screen" id="screen" aria-live="polite"></section>
  </main>

  <script>
    "use strict";

    const WORDS = [
      { word: "bandit", emoji: "🥷", sentence: "The sneaky ___ wore a mask." },
      { word: "box", emoji: "📦", sentence: "Put the new toy inside the ___." },
      { word: "drift", emoji: "🍂", sentence: "We watched the leaf ___ across the pond." },
      { word: "munch", emoji: "😋", sentence: "The rabbits ___ on crunchy carrots." },
      { word: "picnic", emoji: "🧺", sentence: "We ate sandwiches at our sunny ___." },
      { word: "she", emoji: "👧", sentence: "___ is reading her favorite book." },
      { word: "shelf", emoji: "📚", sentence: "Please put the book back on the ___." },
      { word: "sprang", emoji: "🐸", sentence: "The green frog ___ into the pond." },
      { word: "think", emoji: "🤔", sentence: "Stop and ___ before you answer." },
      { word: "wish", emoji: "🌠", sentence: "Make a ___ before you blow out the candles." }
    ];

    const STORAGE_KEY = "mobile-spelling-quest-v1";
    const screen = document.getElementById("screen");
    const topbar = document.querySelector(".topbar");
    const levelPill = document.getElementById("levelPill");
    const audio = new Audio();
    audio.preload = "auto";
    const effectAudio = new Audio();
    effectAudio.preload = "auto";

    const isIPad = /iPad/i.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    document.body.classList.toggle("is-ipad", isIPad);

    let state = loadState();
    let selectedWord = null;
    let locked = false;
    let viewVersion = 0;

    function shuffled(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
      }
      return copy;
    }

    function freshState() {
      return {
        started: false,
        level: 1,
        rounds: { 1: 0, 2: 0, 3: 0 },
        orders: {
          1: shuffled(WORDS.map((item) => item.word)),
          2: shuffled(WORDS.map((item) => item.word)),
          3: shuffled(WORDS.map((item) => item.word))
        },
        mastered: { 1: [], 2: [], 3: [] },
        roundHadError: { 1: false, 2: false, 3: false }
      };
    }

    function validOrder(order) {
      return Array.isArray(order)
        && order.length >= WORDS.length
        && order.every((word) => wordData(word))
        && WORDS.every((item) => order.includes(item.word));
    }

    function validMastered(list) {
      return Array.isArray(list)
        && new Set(list).size === list.length
        && list.every((word) => wordData(word));
    }

    function inferMastered(saved, rounds) {
      const mastered = { 1: [], 2: [], 3: [] };
      [1, 2, 3].forEach((level) => {
        if (saved.level > level) {
          mastered[level] = WORDS.map((item) => item.word);
        } else {
          mastered[level] = [...new Set(saved.orders[level].slice(0, rounds[level]))];
        }
      });
      return mastered;
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (
          saved
          && Number.isInteger(saved.level)
          && saved.level >= 1
          && saved.level <= 4
          && saved.orders
          && validOrder(saved.orders[1])
          && validOrder(saved.orders[2])
          && validOrder(saved.orders[3])
        ) {
          const hasValidRounds = saved.rounds
            && [1, 2, 3].every((level) => Number.isInteger(saved.rounds[level])
              && saved.rounds[level] >= 0
              && saved.rounds[level] <= saved.orders[level].length);
          const oldRound = Number.isInteger(saved.round) && saved.round >= 0 ? saved.round : 0;
          const rounds = hasValidRounds ? saved.rounds : { 1: 0, 2: 0, 3: 0 };
          if (!hasValidRounds) {
            [1, 2, 3].forEach((level) => {
              rounds[level] = saved.level > level
                ? saved.orders[level].length
                : saved.level === level
                  ? Math.min(oldRound, saved.orders[level].length)
                  : 0;
            });
          }
          const hasValidMastery = saved.mastered
            && validMastered(saved.mastered[1])
            && validMastered(saved.mastered[2])
            && validMastered(saved.mastered[3]);
          saved.rounds = rounds;
          saved.mastered = hasValidMastery ? saved.mastered : inferMastered(saved, rounds);
          const oldRoundHadError = Boolean(saved.roundHadError);
          saved.roundHadError = saved.roundHadError
            && typeof saved.roundHadError === "object"
            ? {
                1: Boolean(saved.roundHadError[1]),
                2: Boolean(saved.roundHadError[2]),
                3: Boolean(saved.roundHadError[3])
              }
            : {
                1: saved.level === 1 && oldRoundHadError,
                2: saved.level === 2 && oldRoundHadError,
                3: saved.level === 3 && oldRoundHadError
              };
          delete saved.round;
          return saved;
        }
      } catch (error) {
        console.info("Starting a new quest because saved progress could not be read.");
      }
      return freshState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.info("Progress could not be saved on this device.");
      }
    }

    function currentRound() {
      return state.rounds[state.level];
    }

    function recordIncorrectAttempt() {
      if (state.roundHadError[state.level]) return;
      state.roundHadError[state.level] = true;
      saveState();
    }

    function queueWordForRetry(word) {
      const order = state.orders[state.level];
      const round = currentRound();
      const earliestPosition = round + 1 < order.length
        ? round + 2
        : round + 1;
      const openPositions = order.length - earliestPosition + 1;
      const insertAt = earliestPosition + Math.floor(Math.random() * openPositions);
      order.splice(insertAt, 0, word);
    }

    function advanceAfterCorrect(word) {
      const needsRetry = state.roundHadError[state.level];
      if (needsRetry) {
        queueWordForRetry(word);
      } else if (!state.mastered[state.level].includes(word)) {
        state.mastered[state.level].push(word);
      }
      state.roundHadError[state.level] = false;
      state.rounds[state.level] += 1;
      return needsRetry;
    }

    function wordData(word) {
      return WORDS.find((item) => item.word === word);
    }

    function currentWord() {
      return wordData(state.orders[state.level][currentRound()]);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function playAudio(word) {
      audio.pause();
      audio.src = `sounds/${word}.mp3`;
      audio.currentTime = 0;
      const promise = audio.play();
      if (promise) {
        promise.catch(() => {
          const feedback = document.getElementById("feedback");
          if (feedback) {
            feedback.textContent = "Tap the play button to hear the word.";
          }
        });
      }
    }

    function playEffect(name, onEnded = null) {
      effectAudio.pause();
      effectAudio.onended = null;
      effectAudio.src = `sounds/${name}.mp3`;
      effectAudio.currentTime = 0;
      if (onEnded) effectAudio.onended = onEnded;
      const promise = effectAudio.play();
      if (promise) promise.catch(() => {
        if (onEnded) onEnded();
      });
    }

    function levelName(level) {
      return {
        1: "Sentence Match",
        2: "Letter Builder",
        3: "Super Speller"
      }[level] || "Quest Complete";
    }

    function updateHeader(showLevel = false) {
      topbar.classList.toggle("hidden", !showLevel);
      levelPill.classList.toggle("visible", showLevel);
      levelPill.textContent = showLevel ? `Level ${state.level} · ${levelName(state.level)}` : "";
    }

    function levelProgressText(level) {
      const mastered = state.mastered[level].length;
      if (mastered === WORDS.length) return "Complete · tap to replay";
      if (state.rounds[level] > 0) return `${mastered} of ${WORDS.length} mastered`;
      return "Start this level";
    }

    function levelButtonsMarkup() {
      return [1, 2, 3].map((level) => `
        <button class="level-choice-button" data-select-level="${level}">
          <span class="level-choice-number">${level}</span>
          <span class="level-choice-copy">
            <span>${levelName(level)}</span>
            <small>${levelProgressText(level)}</small>
          </span>
        </button>
      `).join("");
    }

    function resetLevel(level) {
      state.orders[level] = shuffled(WORDS.map((item) => item.word));
      state.mastered[level] = [];
      state.rounds[level] = 0;
      state.roundHadError[level] = false;
    }

    function selectLevel(level) {
      if (state.mastered[level].length === WORDS.length) resetLevel(level);
      state.level = level;
      state.started = true;
      saveState();
      document.querySelector(".level-switcher-backdrop")?.remove();
      renderRound({ autoplay: level > 1 });
    }

    function wireLevelButtons(container = document) {
      container.querySelectorAll("[data-select-level]").forEach((button) => {
        button.addEventListener("click", () => selectLevel(Number(button.dataset.selectLevel)));
      });
    }

    function openLevelMenu() {
      if (document.querySelector(".level-switcher-backdrop")) return;
      const backdrop = document.createElement("div");
      backdrop.className = "level-switcher-backdrop";
      backdrop.setAttribute("role", "dialog");
      backdrop.setAttribute("aria-modal", "true");
      backdrop.setAttribute("aria-labelledby", "levelSwitcherTitle");
      backdrop.innerHTML = `
        <div class="level-switcher">
          <h2 id="levelSwitcherTitle">Choose a level</h2>
          <div class="start-levels">${levelButtonsMarkup()}</div>
          <button class="close-level-switcher" type="button">Keep Playing</button>
        </div>
      `;
      document.body.appendChild(backdrop);
      wireLevelButtons(backdrop);
      const close = () => backdrop.remove();
      backdrop.querySelector(".close-level-switcher").addEventListener("click", close);
      backdrop.addEventListener("pointerdown", (event) => {
        if (event.target === backdrop) close();
      });
      backdrop.querySelector("[data-select-level]")?.focus();
    }

    function renderStart() {
      if ([1, 2, 3].every((level) => state.mastered[level].length === WORDS.length)) {
        state.level = 4;
        saveState();
        renderComplete();
        return;
      }
      updateHeader(false);
      screen.innerHTML = `
        <div class="card hero">
          <div class="hero-orbit" aria-hidden="true">🚀</div>
          <h1>Spelling Quest</h1>
          <div class="start-levels">${levelButtonsMarkup()}</div>
        </div>
      `;
      wireLevelButtons(screen);
    }

    function progressMarkup() {
      const completed = state.mastered[state.level].length;
      const percent = (completed / WORDS.length) * 100;
      return `
        <div class="progress-wrap">
          <div class="progress-copy">
            <span>${completed} of ${WORDS.length} words mastered</span>
            <span>${completed} stars earned</span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Level progress" aria-valuemin="0" aria-valuemax="${WORDS.length}" aria-valuenow="${completed}">
            <div class="progress-fill" style="width: ${percent}%"></div>
          </div>
        </div>
      `;
    }

    function renderRound(options = {}) {
      viewVersion += 1;
      selectedWord = null;
      locked = false;
      updateHeader(true);

      if (currentRound() >= state.orders[state.level].length) {
        renderLevelComplete();
        return;
      }

      if (state.level === 1) {
        renderSentenceRound();
      } else if (state.level === 2) {
        renderSlotRound();
      } else {
        renderBlankRound();
      }

      if (options.autoplay && state.level > 1) {
        playAudio(currentWord().word);
      }
    }

    function renderSentenceRound() {
      const target = currentWord();
      const distractors = shuffled(WORDS.filter((item) => item.word !== target.word)).slice(0, 2);
      const choices = shuffled([target, ...distractors]);
      const sentenceParts = target.sentence.split("___");

      screen.innerHTML = `
        ${progressMarkup()}
        <div class="round-card" id="roundCard">
          <h2>Finish the sentence</h2>
          ${trickyBadge(target)}
          <p class="sentence">
            ${escapeHtml(sentenceParts[0])}<button class="drop-zone" id="dropZone" aria-label="Sentence blank">blank</button>${escapeHtml(sentenceParts[1] || "")}
          </p>
          <div class="choices" id="choices">
            ${choices.map((item) => `
              <button class="word-choice" data-word="${item.word}" aria-label="${item.word}, ${item.emoji}" aria-pressed="false">
                <span class="emoji" aria-hidden="true">${item.emoji}</span>
                <span class="word">${item.word}</span>
              </button>
            `).join("")}
          </div>
          <p class="feedback" id="feedback" aria-live="assertive"></p>
        </div>
      `;

      const dropZone = document.getElementById("dropZone");
      dropZone.addEventListener("click", () => {
        if (!selectedWord || locked) return;
        checkAnswer(selectedWord);
      });

      document.querySelectorAll(".word-choice").forEach((choice) => {
        attachChoiceEvents(choice, dropZone);
      });
    }

    function attachChoiceEvents(choice, dropZone) {
      let startX = 0;
      let startY = 0;
      let dragging = false;
      let ghost = null;
      let suppressClick = false;
      const isNearDrop = (x, y) => {
        const rect = dropZone.getBoundingClientRect();
        const margin = 22;
        return x >= rect.left - margin
          && x <= rect.right + margin
          && y >= rect.top - margin
          && y <= rect.bottom + margin;
      };

      choice.addEventListener("pointerdown", (event) => {
        if (locked || event.button > 0) return;
        startX = event.clientX;
        startY = event.clientY;
        dragging = false;
        suppressClick = false;
        choice.setPointerCapture(event.pointerId);
        playAudio(choice.dataset.word);
      });

      choice.addEventListener("pointermove", (event) => {
        if (!choice.hasPointerCapture(event.pointerId) || locked) return;
        const distance = Math.hypot(event.clientX - startX, event.clientY - startY);
        if (distance < 9 && !dragging) return;

        if (!dragging) {
          dragging = true;
          suppressClick = true;
          const item = wordData(choice.dataset.word);
          const dropRect = dropZone.getBoundingClientRect();
          ghost = document.createElement("div");
          ghost.className = "drag-ghost";
          ghost.textContent = item.word;
          ghost.style.width = `${dropRect.width}px`;
          ghost.style.height = `${dropRect.height}px`;
          document.body.appendChild(ghost);
        }

        const rect = dropZone.getBoundingClientRect();
        const over = isNearDrop(event.clientX, event.clientY);
        ghost.classList.toggle("snapped", over);
        ghost.style.left = `${over ? rect.left + rect.width / 2 : event.clientX}px`;
        ghost.style.top = `${over ? rect.top + rect.height / 2 : event.clientY}px`;
        dropZone.classList.toggle("drag-over", over);
      });

      choice.addEventListener("pointerup", (event) => {
        if (choice.hasPointerCapture(event.pointerId)) {
          choice.releasePointerCapture(event.pointerId);
        }
        if (ghost) ghost.remove();
        dropZone.classList.remove("drag-over");

        if (dragging) {
          if (isNearDrop(event.clientX, event.clientY)) checkAnswer(choice.dataset.word);
        }
      });

      choice.addEventListener("pointercancel", () => {
        if (ghost) ghost.remove();
        dropZone.classList.remove("drag-over");
      });

      choice.addEventListener("click", () => {
        if (locked || suppressClick) {
          suppressClick = false;
          return;
        }
        document.querySelectorAll(".word-choice").forEach((item) => item.classList.remove("selected"));
        document.querySelectorAll(".word-choice").forEach((item) => item.setAttribute("aria-pressed", "false"));
        choice.classList.add("selected");
        choice.setAttribute("aria-pressed", "true");
        selectedWord = choice.dataset.word;
        dropZone.textContent = selectedWord;
        dropZone.setAttribute("aria-label", `Sentence blank filled with ${selectedWord}. Tap to submit.`);
        dropZone.classList.add("ready");
        document.getElementById("feedback").textContent = "Now tap the blank to place it.";
      });

      choice.addEventListener("keydown", (event) => {
        if ((event.key === "Enter" || event.key === " ") && !locked) {
          playAudio(choice.dataset.word);
        }
      });
    }

    function trickyBadge(target) {
      return target.word === "she"
        ? '<span class="tricky-badge">Tricky Word</span>'
        : "";
    }

    function renderSlotRound() {
      const target = currentWord();
      screen.innerHTML = `
        ${progressMarkup()}
        <div class="round-card" id="roundCard">
          <p class="eyebrow">Listen and spell</p>
          <h2>Build the word</h2>
          <div class="audio-stage">
            <div class="emoji-bubble" aria-hidden="true">${target.emoji}</div>
            <button class="sound-button" id="soundButton" aria-label="Play the spelling word again">
              <span class="play-icon" aria-hidden="true"></span>
              Hear the word
            </button>
            ${trickyBadge(target)}
          </div>
          <div class="slots-wrap" id="slotsWrap" role="group" aria-label="${target.word.length} letter spaces. Tap a space to type there.">
            ${Array.from({ length: target.word.length }, (_, index) => `<span class="letter-slot" data-index="${index}" tabindex="0" role="button" aria-label="Letter space ${index + 1}, blank"></span>`).join("")}
            <input
              class="typing-capture"
              id="spellInput"
              type="text"
              inputmode="text"
              enterkeyhint="done"
              autocapitalize="none"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
              aria-label="Type the ${target.word.length} letter word"
            >
          </div>
          <div class="action-row">
            <button class="primary-button wide-button" id="checkButton">Check My Word</button>
          </div>
          <p class="feedback" id="feedback" aria-live="assertive"></p>
        </div>
      `;
      wireSpellingInput(target, true);
    }

    function renderBlankRound() {
      const target = currentWord();
      screen.innerHTML = `
        ${progressMarkup()}
        <div class="round-card" id="roundCard">
          <p class="eyebrow">Final challenge</p>
          <h2>Spell what you hear</h2>
          <div class="audio-stage">
            <div class="emoji-bubble" aria-hidden="true">${target.emoji}</div>
            <button class="sound-button" id="soundButton" aria-label="Play the spelling word again">
              <span class="play-icon" aria-hidden="true"></span>
              Hear the word
            </button>
            ${trickyBadge(target)}
          </div>
          <input
            class="plain-input"
            id="spellInput"
            type="text"
            inputmode="text"
            enterkeyhint="done"
            autocapitalize="none"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Type the word you hear"
            placeholder="type the word"
          >
          <div class="action-row">
            <button class="primary-button wide-button" id="checkButton">Check My Word</button>
          </div>
          <p class="feedback" id="feedback" aria-live="assertive"></p>
        </div>
      `;
      wireSpellingInput(target, false);
    }

    function showCorrectionPopup(target, attempt, input, feedback) {
      if (document.querySelector(".correction-backdrop")) return;
      input.blur();
      const correctedWord = [...target.word].map((letter, index) => {
        const safeLetter = escapeHtml(letter);
        return attempt[index] === letter
          ? `<span>${safeLetter}</span>`
          : `<strong class="corrected-letter">${safeLetter}</strong>`;
      }).join("");

      const backdrop = document.createElement("div");
      backdrop.className = "correction-backdrop";
      backdrop.setAttribute("role", "alertdialog");
      backdrop.setAttribute("aria-modal", "true");
      backdrop.setAttribute("aria-labelledby", "correctionTitle");
      backdrop.setAttribute("aria-describedby", "correctionWord");
      backdrop.innerHTML = `
        <div class="correction-dialog">
          <p class="eyebrow">Correct spelling</p>
          <h2 id="correctionTitle">Look closely</h2>
          <div class="correction-word" id="correctionWord" aria-label="The correct spelling is ${escapeHtml(target.word)}">
            ${correctedWord}
          </div>
          <button class="primary-button wide-button" id="tryAgainButton">Try again.</button>
        </div>
      `;
      document.body.appendChild(backdrop);

      const tryAgainButton = document.getElementById("tryAgainButton");
      tryAgainButton.addEventListener("click", () => {
        backdrop.remove();
        input.value = "";
        feedback.textContent = "";
        feedback.className = "feedback";
        input.focus();
      });
      tryAgainButton.focus();
    }

    function wireSpellingInput(target, hasSlots) {
      const input = document.getElementById("spellInput");
      const feedback = document.getElementById("feedback");
      const roundCard = document.getElementById("roundCard");

      document.getElementById("soundButton").addEventListener("click", () => playAudio(target.word));

      if (hasSlots) {
        wireSlotSpellingInput(target, input, feedback, roundCard);
        return;
      }

      input.addEventListener("input", () => {
        feedback.textContent = "";
        feedback.className = "feedback";
      });

      const submit = () => {
        if (locked) return;
        const answer = input.value.trim().toLowerCase();
        if (!answer) {
          feedback.textContent = "Type your best spelling first.";
          feedback.className = "feedback try";
          input.focus();
          return;
        }
        if (answer === target.word) {
          checkAnswer(answer);
        } else {
          recordIncorrectAttempt();
          roundCard.classList.remove("shake");
          void roundCard.offsetWidth;
          roundCard.classList.add("shake");
          showCorrectionPopup(target, answer, input, feedback);
        }
      };

      document.getElementById("checkButton").addEventListener("click", submit);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          submit();
        }
      });

      input.focus();
    }

    function evaluateLetters(letters, targetWord) {
      const results = Array(letters.length).fill("absent");
      const remaining = {};

      letters.forEach((letter, index) => {
        if (letter === targetWord[index]) {
          results[index] = "correct";
        } else {
          remaining[targetWord[index]] = (remaining[targetWord[index]] || 0) + 1;
        }
      });

      letters.forEach((letter, index) => {
        if (results[index] === "correct") return;
        if (remaining[letter] > 0) {
          results[index] = "misplaced";
          remaining[letter] -= 1;
        }
      });

      return results;
    }

    function wireSlotSpellingInput(target, input, feedback, roundCard) {
      const slots = [...document.querySelectorAll(".letter-slot")];
      const letters = Array(target.word.length).fill("");
      const statuses = Array(target.word.length).fill("empty");
      let selectedIndex = null;
      let dragState = null;
      let ignoreClicksUntil = 0;
      const captureSentinel = "\u200B";

      const resetCaptureInput = () => {
        input.value = captureSentinel;
        input.setSelectionRange(input.value.length, input.value.length);
      };

      const focusKeyboard = () => {
        resetCaptureInput();
        input.focus({ preventScroll: true });
      };

      const renderSlots = () => {
        slots.forEach((slot, index) => {
          slot.textContent = letters[index];
          slot.classList.toggle("correct", statuses[index] === "correct");
          slot.classList.toggle("misplaced", statuses[index] === "misplaced");
          slot.classList.toggle("selected", selectedIndex === index);
          const description = letters[index] || "blank";
          const result = statuses[index] === "correct"
            ? ", correct and locked"
            : statuses[index] === "misplaced"
              ? ", correct letter in the wrong place, draggable"
              : "";
          slot.setAttribute("aria-label", `Letter space ${index + 1}, ${description}${result}`);
          slot.setAttribute("aria-disabled", statuses[index] === "correct" ? "true" : "false");
        });
      };

      const chooseSlot = (index) => {
        if (statuses[index] === "correct") return;
        selectedIndex = index;
        renderSlots();
        focusKeyboard();
      };

      const firstBlank = () => letters.findIndex((letter) => !letter);

      const placeLetter = (letter) => {
        let index = selectedIndex;
        if (index === null || statuses[index] === "correct") index = firstBlank();
        if (index < 0) {
          feedback.textContent = "All spaces are full. Tap a letter to replace it.";
          feedback.className = "feedback try";
          return;
        }
        letters[index] = letter;
        statuses[index] = "unmarked";
        selectedIndex = null;
        feedback.textContent = "";
        feedback.className = "feedback";
        renderSlots();
      };

      const removeLetter = () => {
        let index = selectedIndex;
        if (index === null || statuses[index] === "correct" || !letters[index]) {
          index = -1;
          for (let cursor = letters.length - 1; cursor >= 0; cursor -= 1) {
            if (letters[cursor] && statuses[cursor] !== "correct") {
              index = cursor;
              break;
            }
          }
        }
        if (index < 0) return;
        letters[index] = "";
        statuses[index] = "empty";
        selectedIndex = index;
        renderSlots();
      };

      const finishDrag = (event, shouldDrop = true) => {
        if (!dragState) return;
        const { source, ghost, dragging } = dragState;
        if (ghost) ghost.remove();
        slots.forEach((slot) => slot.classList.remove("drag-over"));

        if (dragging && shouldDrop) {
          ignoreClicksUntil = performance.now() + 250;
          const targetSlot = document.elementFromPoint(event.clientX, event.clientY)?.closest(".letter-slot");
          const destination = targetSlot ? Number(targetSlot.dataset.index) : -1;
          if (destination >= 0 && destination !== source && statuses[destination] !== "correct") {
            [letters[source], letters[destination]] = [letters[destination], letters[source]];
            [statuses[source], statuses[destination]] = [statuses[destination], statuses[source]];
            if (!letters[source]) statuses[source] = "empty";
            selectedIndex = null;
            renderSlots();
            feedback.textContent = "Letter moved. Fill any blank spaces, then check again.";
            feedback.className = "feedback";
            focusKeyboard();
          }
        }
        dragState = null;
      };

      slots.forEach((slot, index) => {
        slot.addEventListener("click", () => {
          if (performance.now() < ignoreClicksUntil) return;
          chooseSlot(index);
        });
        slot.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            chooseSlot(index);
          }
        });
        slot.addEventListener("pointerdown", (event) => {
          if (statuses[index] !== "misplaced" || event.button > 0) return;
          slot.setPointerCapture(event.pointerId);
          dragState = {
            source: index,
            startX: event.clientX,
            startY: event.clientY,
            dragging: false,
            ghost: null
          };
        });
        slot.addEventListener("pointermove", (event) => {
          if (!dragState || dragState.source !== index) return;
          const distance = Math.hypot(event.clientX - dragState.startX, event.clientY - dragState.startY);
          if (distance < 8 && !dragState.dragging) return;
          if (!dragState.dragging) {
            dragState.dragging = true;
            const sourceRect = slot.getBoundingClientRect();
            dragState.ghost = document.createElement("span");
            dragState.ghost.className = "letter-drag-ghost";
            dragState.ghost.textContent = letters[index];
            dragState.ghost.style.width = `${sourceRect.width}px`;
            dragState.ghost.style.height = `${sourceRect.height}px`;
            document.body.appendChild(dragState.ghost);
          }
          slots.forEach((item) => item.classList.remove("drag-over"));
          const targetSlot = document.elementFromPoint(event.clientX, event.clientY)?.closest(".letter-slot");
          const validTarget = targetSlot && statuses[Number(targetSlot.dataset.index)] !== "correct";
          dragState.ghost.classList.toggle("snapped", Boolean(validTarget));
          if (validTarget) {
            const targetRect = targetSlot.getBoundingClientRect();
            dragState.ghost.style.left = `${targetRect.left + targetRect.width / 2}px`;
            dragState.ghost.style.top = `${targetRect.top + targetRect.height / 2}px`;
            targetSlot.classList.add("drag-over");
          } else {
            dragState.ghost.style.left = `${event.clientX}px`;
            dragState.ghost.style.top = `${event.clientY}px`;
          }
        });
        slot.addEventListener("pointerup", (event) => {
          if (slot.hasPointerCapture(event.pointerId)) slot.releasePointerCapture(event.pointerId);
          finishDrag(event);
        });
        slot.addEventListener("pointercancel", (event) => finishDrag(event, false));
      });

      input.addEventListener("beforeinput", (event) => {
        if (!event.inputType?.startsWith("delete")) return;
        event.preventDefault();
        removeLetter();
        resetCaptureInput();
      });

      input.addEventListener("input", (event) => {
        if (event.inputType?.startsWith("delete")) {
          removeLetter();
        } else {
          const typed = (event.data || input.value).toLowerCase().replace(/[^a-z]/g, "");
          [...typed].forEach(placeLetter);
        }
        resetCaptureInput();
      });

      const submit = () => {
        if (locked) return;
        if (letters.some((letter) => !letter)) {
          feedback.textContent = "Fill every letter space before checking.";
          feedback.className = "feedback try";
          selectedIndex = firstBlank();
          renderSlots();
          focusKeyboard();
          return;
        }

        const answer = letters.join("");
        if (answer === target.word) {
          checkAnswer(answer);
          return;
        }

        recordIncorrectAttempt();
        const results = evaluateLetters(letters, target.word);
        results.forEach((result, index) => {
          if (result === "absent") {
            letters[index] = "";
            statuses[index] = "empty";
          } else {
            statuses[index] = result;
          }
        });
        selectedIndex = null;
        renderSlots();
        feedback.textContent = "Green letters are correct. Move the yellow letters, then fill the blanks.";
        feedback.className = "feedback try";
        roundCard.classList.remove("shake");
        void roundCard.offsetWidth;
        roundCard.classList.add("shake");
        playAudio(target.word);
        focusKeyboard();
      };

      document.getElementById("checkButton").addEventListener("click", submit);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Backspace" || event.key === "Delete") {
          event.preventDefault();
          removeLetter();
          resetCaptureInput();
          return;
        }
        if (event.key === "Enter") {
          event.preventDefault();
          submit();
        }
      });

      renderSlots();
      focusKeyboard();
    }

    function checkAnswer(answer) {
      if (locked) return;
      const target = currentWord();

      if (answer.toLowerCase() === target.word) {
        locked = true;
        const needsRetry = advanceAfterCorrect(target.word);
        const finishedLevel = currentRound() >= state.orders[state.level].length;
        saveState();
        playEffect("correct", finishedLevel ? () => playEffect("win") : null);
        const feedback = document.getElementById("feedback");
        if (feedback) {
          feedback.textContent = "You got it!";
          feedback.className = "feedback good";
        }
        const successViewVersion = viewVersion;
        window.setTimeout(() => {
          if (viewVersion === successViewVersion) renderWordSuccess(target, needsRetry);
        }, 420);
      } else {
        recordIncorrectAttempt();
        const card = document.getElementById("roundCard");
        const feedback = document.getElementById("feedback");
        feedback.textContent = "Almost! Try another word.";
        feedback.className = "feedback try";
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
        selectedWord = null;
        document.querySelectorAll(".word-choice").forEach((item) => {
          item.classList.remove("selected");
          item.setAttribute("aria-pressed", "false");
        });
        const dropZone = document.getElementById("dropZone");
        dropZone.textContent = "blank";
        dropZone.setAttribute("aria-label", "Sentence blank");
        dropZone.classList.remove("ready");
      }
    }

    function renderWordSuccess(target, needsRetry = false) {
      updateHeader(true);
      const isLast = currentRound() >= state.orders[state.level].length;
      screen.innerHTML = `
        <div class="card success-panel">
          <span class="success-emoji" aria-hidden="true">${target.emoji}</span>
          <p class="eyebrow">${needsRetry ? "Good correction" : "Star earned"}</p>
          <h2>${escapeHtml(target.word)}</h2>
          <p class="subtitle">${needsRetry ? "You fixed it! This word will return later so you can master it on the first try." : encouragement()}</p>
          <div class="stars-earned" aria-label="${needsRetry ? "Word will return" : "Three stars"}">${needsRetry ? "↻" : "★ ★ ★"}</div>
          <button class="primary-button wide-button" id="nextButton">
            ${isLast ? "Finish the Level" : "Next Word"}
            <span aria-hidden="true">→</span>
          </button>
        </div>
      `;
      burstConfetti(needsRetry ? 8 : 18);
      document.getElementById("nextButton").addEventListener("click", () => {
        renderRound({ autoplay: state.level > 1 });
      });
    }

    function encouragement() {
      const messages = [
        "Fantastic spelling!",
        "Your word power is growing!",
        "Brilliant work!",
        "You cracked that word!",
        "Super listening!"
      ];
      return messages[Math.floor(Math.random() * messages.length)];
    }

    function renderLevelComplete() {
      const completedLevel = state.level;
      const allLevelsComplete = [1, 2, 3].every((level) => state.mastered[level].length === WORDS.length);
      if (allLevelsComplete) {
        state.level = 4;
        saveState();
        renderComplete();
        return;
      }

      updateHeader(true);
      const unfinishedLevels = [1, 2, 3].filter((level) => state.mastered[level].length < WORDS.length);
      const nextLevel = unfinishedLevels.find((level) => level > completedLevel) || unfinishedLevels[0];
      screen.innerHTML = `
        <div class="card level-panel">
          <span class="success-emoji" aria-hidden="true">🏆</span>
          <p class="eyebrow">Level ${completedLevel} complete</p>
          <h2>Amazing work!</h2>
          <p class="subtitle">You earned all ten stars. Your next challenge is ready.</p>
          ${levelMap(nextLevel)}
          <button class="primary-button wide-button" id="nextLevelButton">
            Start Level ${nextLevel}
            <span aria-hidden="true">→</span>
          </button>
        </div>
      `;
      burstConfetti(38);
      document.getElementById("nextLevelButton").addEventListener("click", () => {
        selectLevel(nextLevel);
      });
    }

    function levelMap(current) {
      return `
        <div class="level-map" aria-label="Quest map">
          ${[1, 2, 3].map((level) => {
            const complete = state.mastered[level].length === WORDS.length;
            const status = complete ? "done" : level === current ? "current" : "";
            const number = complete ? "✓" : level;
            return `
              <div class="map-step ${status}">
                <span class="map-number">${number}</span>
                <span>${levelName(level)}</span>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderComplete() {
      updateHeader(false);
      screen.innerHTML = `
        <div class="card hero">
          <div class="hero-orbit" aria-hidden="true">🏆</div>
          <p class="eyebrow">Quest complete</p>
          <h1>Super Speller!</h1>
          <p class="subtitle">You finished all three levels and spelled every word. That was incredible!</p>
          <div class="stars-earned" aria-label="Five stars">★ ★ ★ ★ ★</div>
          <div class="start-levels">${levelButtonsMarkup()}</div>
        </div>
      `;
      burstConfetti(70);
      wireLevelButtons(screen);
    }

    function burstConfetti(count) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const colors = ["#6254e7", "#55d6a2", "#ffca5c", "#ff7c78", "#36bad5"];
      for (let index = 0; index < count; index += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = colors[index % colors.length];
        piece.style.animationDelay = `${Math.random() * 0.55}s`;
        piece.style.animationDuration = `${1.8 + Math.random() * 1.2}s`;
        piece.style.setProperty("--drift", `${-90 + Math.random() * 180}px`);
        document.body.appendChild(piece);
        window.setTimeout(() => piece.remove(), 3300);
      }
    }

    levelPill.addEventListener("click", openLevelMenu);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") document.querySelector(".level-switcher-backdrop")?.remove();
    });
    renderStart();
  </script>
</body>
