<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155eef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Skip Count Trail</title>
  <style>
    :root {
      --ink: #172b4d;
      --muted: #61708a;
      --blue: #155eef;
      --blue-dark: #0b46bd;
      --blue-soft: #e8f0ff;
      --green: #17875f;
      --green-soft: #dff7ec;
      --orange: #963d00;
      --orange-soft: #fff0df;
      --paper: rgba(255, 255, 255, 0.96);
      --shadow: 0 20px 55px rgba(20, 54, 110, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 199, 92, 0.42) 0 8%, transparent 8.4%),
        radial-gradient(circle at 88% 15%, rgba(73, 195, 176, 0.35) 0 9%, transparent 9.4%),
        linear-gradient(155deg, #edf4ff 0%, #ecfbf7 55%, #fff8df 100%);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 4px solid #0b46bd;
      outline-offset: 3px;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 760px;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(16px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
    }

    .screen {
      display: flex;
      width: 100%;
      min-width: 0;
      flex: 1;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      min-height: 48px;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand {
      margin-right: auto;
      font-weight: 950;
      letter-spacing: -0.02em;
    }

    .home-link {
      display: inline-flex;
      align-self: flex-start;
      min-height: 38px;
      align-items: center;
      margin-bottom: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--blue-dark);
      font-size: 0.82rem;
      font-weight: 900;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 6px 18px rgba(20, 54, 110, 0.08);
    }

    .home-link:focus-visible {
      outline: 4px solid var(--blue-dark);
      outline-offset: 3px;
    }

    .step-pill,
    .stage-pill {
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--blue-dark);
      font-size: 0.82rem;
      font-weight: 900;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 6px 18px rgba(20, 54, 110, 0.08);
    }

    .card {
      width: 100%;
      min-width: 0;
      margin: auto 0;
      padding: clamp(22px, 5vw, 38px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .hero,
    .complete {
      text-align: center;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(2.15rem, 9vw, 3.7rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    h2 {
      margin-bottom: 9px;
      font-size: clamp(1.55rem, 6vw, 2.35rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .subtitle {
      max-width: 480px;
      margin: 0 auto 24px;
      color: var(--muted);
      font-size: clamp(1rem, 3.8vw, 1.16rem);
      line-height: 1.45;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--blue);
      font-size: 0.8rem;
      font-weight: 950;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .step-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      width: min(100%, 460px);
      margin: 0 auto;
    }

    .step-button {
      min-height: 72px;
      border: 3px solid #d5e1fb;
      border-radius: 19px;
      color: var(--blue-dark);
      font-size: clamp(1.25rem, 5vw, 1.7rem);
      font-weight: 950;
      background: #f5f8ff;
      box-shadow: 0 6px 0 #d5e1fb;
    }

    .step-button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d5e1fb;
    }

    .continue-button,
    .primary-button,
    .secondary-button {
      display: inline-flex;
      width: min(100%, 370px);
      min-height: 56px;
      align-items: center;
      justify-content: center;
      padding: 13px 22px;
      border-radius: 18px;
      font-weight: 950;
    }

    .continue-button,
    .primary-button {
      color: white;
      background: linear-gradient(145deg, #2471f5, #0e4bc7);
      box-shadow: 0 9px 0 #093b9f, 0 16px 28px rgba(21, 94, 239, 0.22);
    }

    .continue-button {
      margin-bottom: 24px;
    }

    .continue-button:active,
    .primary-button:active {
      transform: translateY(4px);
      box-shadow: 0 5px 0 #093b9f, 0 10px 22px rgba(21, 94, 239, 0.18);
    }

    .secondary-button {
      color: var(--blue-dark);
      text-decoration: none;
      background: var(--blue-soft);
    }

    .landing-link {
      margin-top: 24px;
    }

    .progress-copy {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 850;
    }

    .progress-track {
      height: 11px;
      overflow: hidden;
      margin-bottom: 18px;
      border-radius: 999px;
      background: #e7ebf2;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #24b47e, #28a6d8);
      transition: width 300ms ease;
    }

    .game-card {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      justify-content: center;
    }

    .trail {
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: center;
      justify-content: center;
      gap: clamp(5px, 2vw, 12px);
      margin: 18px auto 25px;
    }

    .trail-number,
    .sequence-number {
      display: grid;
      width: clamp(50px, 15vw, 76px);
      height: clamp(50px, 15vw, 76px);
      flex: 0 1 auto;
      place-items: center;
      border: 3px solid #d4e0f8;
      border-radius: 50%;
      font-size: clamp(1.15rem, 5vw, 1.65rem);
      font-weight: 950;
      background: #f7f9ff;
    }

    .trail-number.current {
      border-color: var(--blue);
      color: white;
      background: var(--blue);
      box-shadow: 0 9px 20px rgba(21, 94, 239, 0.23);
    }

    .trail-line {
      width: clamp(13px, 4vw, 30px);
      height: 5px;
      flex: 0 1 30px;
      border-radius: 999px;
      background: #c9d6ed;
    }

    .question {
      margin-bottom: 18px;
      font-size: clamp(1.35rem, 5.5vw, 1.9rem);
      font-weight: 950;
      text-align: center;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 11px;
    }

    .choice-button {
      min-width: 0;
      min-height: 68px;
      border: 3px solid #d7e2fa;
      border-radius: 18px;
      color: var(--ink);
      font-size: clamp(1.2rem, 5vw, 1.65rem);
      font-weight: 950;
      background: #f7f9ff;
      box-shadow: 0 5px 0 #d7e2fa;
    }

    .choice-button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #d7e2fa;
    }

    .sequence {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: center;
      gap: clamp(5px, 2vw, 11px);
      margin: 17px 0 24px;
    }

    .sequence-number.blank {
      border-style: dashed;
      border-color: var(--blue);
      color: var(--blue);
      background: var(--blue-soft);
    }

    .five-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(3px, 1.4vw, 9px);
      width: 100%;
      margin: 24px 0;
    }

    .count-space {
      display: grid;
      width: 100%;
      max-width: 70px;
      aspect-ratio: 1;
      place-self: center;
      place-items: center;
      overflow: hidden;
      border: 3px solid #d4e0f8;
      border-radius: 50%;
      color: var(--ink);
      font-size: clamp(0.86rem, 4.5vw, 1.45rem);
      font-weight: 950;
      background: #f7f9ff;
    }

    .count-space.start {
      border-color: var(--blue);
      color: white;
      background: var(--blue);
    }

    .count-space.filled {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-soft);
    }

    .count-space.just-filled {
      animation: flip-number 650ms cubic-bezier(.2, .85, .3, 1);
    }

    @keyframes flip-number {
      0% { transform: perspective(300px) rotateY(90deg) scale(0.8); }
      60% { transform: perspective(300px) rotateY(-12deg) scale(1.08); }
      100% { transform: perspective(300px) rotateY(0) scale(1); }
    }

    .count-space.active {
      border-style: dashed;
      border-color: var(--blue);
      background: var(--blue-soft);
      box-shadow: 0 0 0 4px rgba(21, 94, 239, 0.12);
    }

    .count-space.future {
      border-style: dashed;
      color: transparent;
      background: white;
    }

    .count-input {
      width: 100%;
      height: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--blue-dark);
      font-size: max(16px, 1em);
      font-weight: 950;
      text-align: center;
      background: transparent;
      caret-color: var(--blue);
    }

    .number-input {
      display: block;
      width: min(100%, 330px);
      min-height: 68px;
      margin: 10px auto 18px;
      padding: 10px 18px;
      border: 3px solid #c9d9fa;
      border-radius: 18px;
      color: var(--ink);
      font-size: clamp(1.45rem, 7vw, 2rem);
      font-weight: 950;
      text-align: center;
      background: #fbfcff;
      caret-color: var(--blue);
    }

    .number-input:focus {
      border-color: var(--blue);
    }

    .feedback-card {
      text-align: center;
    }

    .equation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(7px, 2.4vw, 14px);
      margin: 22px 0 28px;
      font-size: clamp(1.65rem, 8vw, 2.8rem);
      font-weight: 950;
    }

    .answer-hop {
      display: inline-block;
      color: var(--green);
      animation: hop 650ms cubic-bezier(.2, 1.3, .45, 1);
    }

    @keyframes hop {
      0% { transform: translateY(20px) scale(0.7); opacity: 0; }
      55% { transform: translateY(-13px) scale(1.16); opacity: 1; }
      100% { transform: translateY(0) scale(1); }
    }

    .feedback-good {
      color: var(--green);
    }

    .feedback-hint {
      color: var(--orange);
    }

    .button-stack {
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    .mastery-line {
      margin: 18px 0 25px;
      color: var(--green);
      font-size: 1.05rem;
      font-weight: 950;
    }

    @media (max-width: 390px) {
      .app {
        padding-right: 11px;
        padding-left: 11px;
      }

      .card {
        padding: 20px 16px;
        border-radius: 24px;
      }

      .topbar {
        gap: 7px;
      }

      .brand {
        display: none;
      }

      .step-pill,
      .stage-pill {
        padding: 7px 9px;
        font-size: 0.72rem;
      }

      .home-link {
        padding: 7px 9px;
        font-size: 0.72rem;
      }

      .choices {
        gap: 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <a class="home-link" href="../index.html">Back to All Subjects</a>
    <section class="screen" id="screen" aria-live="polite"></section>
  </main>

  <script>
    "use strict";

    const STORAGE_KEY = "skip-count-trail-v2";
    const TOTAL_QUESTIONS = 5;
    const screen = document.getElementById("screen");
    const gameAudio = new Audio();
    gameAudio.preload = "auto";
    let locked = false;
    let state = loadState();
    let audioPlaybackId = 0;

    function stopGameAudio() {
      audioPlaybackId += 1;
      gameAudio.pause();
      gameAudio.onended = null;
      gameAudio.onerror = null;
    }

    function playGameSound(name, onEnded = null) {
      const playbackId = ++audioPlaybackId;
      let settled = false;
      const finish = () => {
        if (settled || playbackId !== audioPlaybackId) return;
        settled = true;
        gameAudio.onended = null;
        gameAudio.onerror = null;
        if (onEnded) onEnded();
      };

      gameAudio.pause();
      gameAudio.onended = finish;
      gameAudio.onerror = finish;
      gameAudio.src = `../spelling/sounds/other/${name}.mp3`;
      gameAudio.currentTime = 0;
      gameAudio.playbackRate = 1;
      const promise = gameAudio.play();
      if (promise) promise.catch(finish);
    }

    function freshState() {
      return {
        active: false,
        complete: false,
        step: null,
        start: null,
        sequence: [],
        queue: [],
        mastered: []
      };
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const validTasks = (items) => Array.isArray(items)
          && items.every((item) => Number.isInteger(item) && item >= 0 && item < TOTAL_QUESTIONS);
        const uniqueMastered = saved && Array.isArray(saved.mastered)
          && new Set(saved.mastered).size === saved.mastered.length;
        const uniqueQueue = saved && Array.isArray(saved.queue)
          && new Set(saved.queue).size === saved.queue.length;
        const orderedProgress = saved
          && Array.isArray(saved.mastered)
          && Array.isArray(saved.queue)
          && saved.mastered.every((task, index) => task === index)
          && saved.queue.every((task, index) => task === saved.mastered.length + index)
          && saved.mastered.length + saved.queue.length === TOTAL_QUESTIONS;
        const expectedSequence = saved && Number.isInteger(saved.step) && Number.isInteger(saved.start)
          ? Array.from({ length: TOTAL_QUESTIONS + 1 }, (_, index) => saved.start + index * saved.step)
          : [];
        const sequenceIsValid = saved
          && Array.isArray(saved.sequence)
          && saved.sequence.length === TOTAL_QUESTIONS + 1
          && saved.sequence.every((value, index) => value === expectedSequence[index])
          && saved.sequence.at(-1) <= 100;
        const masteredSet = new Set(saved?.mastered || []);
        const queueContainsEveryUnmastered = Array.from(
          { length: TOTAL_QUESTIONS },
          (_, index) => index
        ).every((task) => masteredSet.has(task) || saved?.queue?.includes(task));
        const completionIsValid = saved
          && Boolean(saved.complete) === (masteredSet.size === TOTAL_QUESTIONS)
          && (!saved.complete || saved.queue.length === 0);
        if (
          saved
          && saved.active === true
          && Number.isInteger(saved.step)
          && saved.step >= 2
          && saved.step <= 10
          && Number.isInteger(saved.start)
          && saved.start >= 1
          && saved.start <= Math.max(1, 100 - saved.step * TOTAL_QUESTIONS)
          && validTasks(saved.queue)
          && validTasks(saved.mastered)
          && uniqueQueue
          && uniqueMastered
          && orderedProgress
          && sequenceIsValid
          && queueContainsEveryUnmastered
          && completionIsValid
        ) {
          return saved;
        }
      } catch (error) {
        console.info("Starting a new math trail because saved progress could not be read.");
      }
      return freshState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.info("Math progress could not be saved.");
      }
    }

    function shuffled(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
      }
      return copy;
    }

    function startGame(step) {
      stopGameAudio();
      const maxStart = Math.max(1, 100 - step * TOTAL_QUESTIONS);
      const start = 1 + Math.floor(Math.random() * maxStart);
      state = {
        active: true,
        complete: false,
        step,
        start,
        sequence: Array.from({ length: TOTAL_QUESTIONS + 1 }, (_, index) => start + index * step),
        queue: Array.from({ length: TOTAL_QUESTIONS }, (_, index) => index),
        mastered: []
      };
      saveState();
      renderQuestion();
    }

    function renderStart() {
      locked = false;
      const canContinue = state.active && !state.complete && state.queue.length > 0;
      screen.innerHTML = `
        <div class="card hero">
          <p class="eyebrow">Math adventure</p>
          <h1>Skip Count Trail</h1>
          <p class="subtitle">Choose how far to hop, then fill five spaces in a row. The starting number is a surprise.</p>
          ${canContinue ? `<button class="continue-button" id="continueButton">Continue counting by ${state.step}</button>` : ""}
          <div class="step-grid" aria-label="Choose a skip-counting number">
            ${Array.from({ length: 9 }, (_, index) => index + 2).map((step) => `
              <button class="step-button" data-step="${step}">By ${step}</button>
            `).join("")}
          </div>
        </div>
      `;

      document.getElementById("continueButton")?.addEventListener("click", renderQuestion);
      document.querySelectorAll("[data-step]").forEach((button) => {
        button.addEventListener("click", () => startGame(Number(button.dataset.step)));
      });
    }

    function headerMarkup() {
      return `
        <header class="topbar">
          <div class="brand">Skip Count Trail</div>
          <div class="step-pill">Count by ${state.step}</div>
          <div class="stage-pill">Five in a row</div>
        </header>
      `;
    }

    function progressMarkup() {
      const percent = (state.mastered.length / TOTAL_QUESTIONS) * 100;
      return `
        <div class="progress-copy">
          <span>${state.mastered.length} of ${TOTAL_QUESTIONS} complete</span>
          <span>${100 - state.sequence.at(-1)} spaces below 100</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Game progress" aria-valuemin="0" aria-valuemax="${TOTAL_QUESTIONS}" aria-valuenow="${state.mastered.length}">
          <div class="progress-fill" style="width: ${percent}%"></div>
        </div>
      `;
    }

    function fiveRowMarkup(task, justFilledTask = null) {
      return `
        <div class="five-row" aria-label="Starting number followed by five spaces">
          ${state.sequence.map((number, index) => {
            if (index === 0) {
              return `<span class="count-space start" aria-label="Starting number ${number}">${number}</span>`;
            }
            const taskIndex = index - 1;
            if (state.mastered.includes(taskIndex)) {
              return `<span class="count-space filled ${taskIndex === justFilledTask ? "just-filled" : ""}" aria-label="Completed number ${number}">${number}</span>`;
            }
            if (taskIndex === task) {
              return `
                <span class="count-space active">
                  <input
                    class="count-input"
                    id="numberInput"
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    enterkeyhint="done"
                    autocomplete="off"
                    aria-label="Fill space ${index} of 5"
                  >
                </span>
              `;
            }
            return `<span class="count-space future" aria-label="Empty space ${index}">?</span>`;
          }).join("")}
        </div>
        <div style="text-align:center">
          <button class="primary-button" id="checkButton">Check</button>
        </div>
      `;
    }

    function renderQuestion(justFilledTask = null) {
      locked = false;
      if (state.mastered.length === TOTAL_QUESTIONS) {
        if (justFilledTask !== null) {
          renderFinalFill(justFilledTask);
        } else {
          finishGame();
        }
        return;
      }

      const task = state.queue[0];

      screen.innerHTML = `
        ${headerMarkup()}
        ${progressMarkup()}
        <div class="card game-card" id="gameCard">
          <p class="eyebrow">Fill the row</p>
          <h2>Start at ${state.start}. Hop by ${state.step}.</h2>
          <div id="activity">${fiveRowMarkup(task, justFilledTask)}</div>
        </div>
      `;

      const input = document.getElementById("numberInput");
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 3);
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          submitTypedAnswer();
        }
      });
      document.getElementById("checkButton").addEventListener("click", submitTypedAnswer);
      input.focus();
      if (justFilledTask !== null) playGameSound("flip");
    }

    function submitTypedAnswer() {
      const input = document.getElementById("numberInput");
      if (!input || !input.value) {
        input?.focus();
        return;
      }
      submitAnswer(Number(input.value));
    }

    function submitAnswer(answer) {
      if (locked) return;
      locked = true;
      const task = state.queue[0];
      const correct = state.sequence[task + 1];
      if (answer === correct) {
        playGameSound("correct", () => {
          state.queue.shift();
          state.mastered.push(task);
          if (state.mastered.length === TOTAL_QUESTIONS) state.complete = true;
          saveState();
          renderQuestion(task);
        });
        return;
      }
      showFeedback(task, correct);
    }

    function showFeedback(task, correct) {
      const current = state.sequence[task];
      const activity = document.getElementById("activity");
      activity.innerHTML = `
        <div class="feedback-card">
          <p class="eyebrow feedback-hint">Count one hop</p>
          <h2>The next number is ${correct}.</h2>
          <div class="equation" aria-label="${current} plus ${state.step} equals ${correct}">
            <span>${current}</span>
            <span>+</span>
            <span>${state.step}</span>
            <span>=</span>
            <span class="answer-hop">${correct}</span>
          </div>
          <button class="primary-button" id="nextButton">Try Again</button>
        </div>
      `;

      document.getElementById("nextButton").addEventListener("click", () => {
        renderQuestion();
      });
      document.getElementById("nextButton").focus();
    }

    function renderFinalFill(justFilledTask) {
      locked = true;
      screen.innerHTML = `
        ${headerMarkup()}
        ${progressMarkup()}
        <div class="card game-card">
          <p class="eyebrow">Five in a row</p>
          <h2>Start at ${state.start}. Hop by ${state.step}.</h2>
          ${fiveRowMarkup(null, justFilledTask)}
        </div>
      `;
      document.getElementById("checkButton")?.remove();
      playGameSound("flip", () => {
        playGameSound("win", finishGame);
      });
    }

    function finishGame() {
      state.active = true;
      state.complete = true;
      state.queue = [];
      saveState();
      renderComplete();
    }

    function renderComplete() {
      locked = false;
      screen.innerHTML = `
        <div class="card complete">
          <p class="eyebrow">Trail complete</p>
          <h1>Counting Champion</h1>
          <p class="subtitle">You filled five spaces by ${state.step}, starting at ${state.start} and finishing at ${state.sequence.at(-1)}.</p>
          <div class="mastery-line">${state.start} to ${state.sequence.at(-1)}, counting by ${state.step}</div>
          <div class="button-stack">
            <button class="primary-button" id="againButton">Play Again</button>
            <button class="secondary-button" id="chooseButton">Choose Another Number</button>
          </div>
        </div>
      `;
      document.getElementById("againButton").addEventListener("click", () => startGame(state.step));
      document.getElementById("chooseButton").addEventListener("click", () => {
        state = freshState();
        saveState();
        renderStart();
      });
    }

    if (state.active && state.complete) renderComplete();
    else if (state.active && state.queue.length > 0) renderQuestion();
    else renderStart();
  </script>
</body>
</html>
