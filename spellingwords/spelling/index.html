function wireMiniDrawing(id, word, draft) {
  const paper = document.getElementById('miniPaper');
  const ctx = paper.getContext('2d');
  let width = 0;
  let height = 0;
  let activeStroke = null;
  let pointerId = null;
  const letterMode = id === 'dots' || id === 'rainbow';
  draft.letterStrokes ||= {};
  const drawing = letterMode ? (draft.letterStrokes[draft.letterIndex] ||= {strokes: []}) : draft;
  drawing.strokes ||= [];
  let dotPoints = [];
  const repaint = () => {
    const rect = paper.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    const scale = window.devicePixelRatio || 1;
    paper.width = Math.round(width * scale);
    paper.height = Math.round(height * scale);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (id === 'dots') {
      const side = Math.min(width - 24, height - 24);
      const left = (width - side) / 2; const top = (height - side) / 2;
      const paths = MINI_DOT_PATHS[word[draft.letterIndex]];
      const seen = new Set(); dotPoints = [];
      ctx.lineWidth = 2; ctx.strokeStyle = '#eeeaf6';
      paths.forEach(points => {
        ctx.beginPath();
        points.forEach(([x,y],index) => {
          const px = left + x * side / 100; const py = top + y * side / 100;
          index ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
          const key = `${x},${y}`;
          if (!seen.has(key)) { seen.add(key); dotPoints.push([px,py]); }
        });
        ctx.stroke();
      });
      ctx.fillStyle = '#82779e';
      dotPoints.forEach(([x,y]) => { ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill(); });
      paper.dataset.dotCount = String(dotPoints.length);
    } else if (id === 'rainbow') {
      ctx.font = `bold ${Math.min(width * .7, height * .8)}px Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#eeebf5';
      ctx.fillText(word[draft.letterIndex], width / 2, height * .46);
    }
    drawing.strokes.forEach(stroke => {
      ctx.beginPath(); ctx.strokeStyle = stroke.color; ctx.fillStyle = stroke.color; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (stroke.points.length === 1) { const p = stroke.points[0]; ctx.arc(p[0] * width, p[1] * height, 2.5, 0, Math.PI * 2); ctx.fill(); }
      else { stroke.points.forEach((p, index) => index ? ctx.lineTo(p[0] * width, p[1] * height) : ctx.moveTo(p[0] * width, p[1] * height)); ctx.stroke(); }
    });
  };
  const point = event => {
    const rect = paper.getBoundingClientRect(); let x = event.clientX - rect.left; let y = event.clientY - rect.top;
    if (id === 'dots') {
      const near = dotPoints.find(([px,py]) => Math.hypot(px-x,py-y) < 22);
      if (near) [x,y] = near;
    }
    return [Math.max(0,Math.min(1,x / rect.width)), Math.max(0,Math.min(1,y / rect.height))];
  };
  paper.onpointerdown = event => {
    if (pointerId !== null || event.button > 0) return;
    event.preventDefault(); pointerId = event.pointerId; paper.setPointerCapture(pointerId);
    activeStroke = { color: miniColor, points: [point(event)] }; drawing.strokes.push(activeStroke); repaint();
  };
  paper.onpointermove = event => { if (event.pointerId !== pointerId || !activeStroke) return; activeStroke.points.push(point(event)); repaint(); };
  const finish = event => {
    if (event.pointerId !== pointerId) return;
    activeStroke = null; pointerId = null;
    if (letterMode && event.type !== 'pointercancel') miniLetterSound(word[draft.letterIndex]);
    miniMessage(letterMode ? 'Keep writing, or go to the next letter.' : 'Keep drawing, then add your word label.');
  };
  paper.onpointerup = finish; paper.onpointercancel = finish; paper.onlostpointercapture = finish;
  document.getElementById('miniClear').onclick = () => { drawing.strokes = []; activeStroke = null; repaint(); miniMessage('A fresh page!'); };
  const observer = new ResizeObserver(repaint); observer.observe(paper);
  miniDrawingCleanup = () => observer.disconnect();
  repaint();
}

    document.getElementById("miniGamesButton").addEventListener("click", renderMiniBoard);
    renderStart();
  </script>
</body>
