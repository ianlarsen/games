<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Mobile Spelling Quest</title>
  <style>
    :root {
      --ink: #243047;
      --muted: #667085;
      --purple: #6254e7;
      --purple-dark: #4638c5;
      --purple-soft: #eceafe;
      --gold: #ffca5c;
      --mint: #55d6a2;
      --coral: #ff7c78;
      --paper: rgba(255, 255, 255, 0.96);
      --shadow: 0 18px 50px rgba(54, 44, 126, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 202, 92, 0.72) 0 7%, transparent 7.4%),
        radial-gradient(circle at 88% 16%, rgba(85, 214, 162, 0.45) 0 8%, transparent 8.4%),
        linear-gradient(155deg, #f7f0ff 0%, #e9f8ff 48%, #fff8dc 100%);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible,
    input:focus-visible,
    [tabindex="0"]:focus-visible {
      outline: 4px solid rgba(98, 84, 231, 0.3);
      outline-offset: 3px;
    }

    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100dvh;
      max-width: 760px;
      margin: 0 auto;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .sparkles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      color: rgba(98, 84, 231, 0.16);
      font-size: clamp(22px, 6vw, 42px);
      animation: float 7s ease-in-out infinite;
    }

    .sparkle:nth-child(1) { left: 4%; top: 30%; }
    .sparkle:nth-child(2) { right: 5%; top: 42%; animation-delay: -2s; }
    .sparkle:nth-child(3) { left: 10%; bottom: 8%; animation-delay: -4s; }
    .sparkle:nth-child(4) { right: 8%; bottom: 10%; animation-delay: -1s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-14px) rotate(8deg); }
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 50px;
      margin-bottom: 14px;
    }

    .topbar.hidden {
      display: flex;
    }

    .topbar.hidden .brand,
    .topbar.hidden .level-pill {
      display: none;
    }

    .home-link {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      padding: 8px 13px;
      border-radius: 999px;
      color: var(--purple-dark);
      font-size: 0.86rem;
      font-weight: 900;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 6px 18px rgba(54, 44, 126, 0.08);
    }

    .home-link:focus-visible {
      outline: 4px solid var(--purple-dark);
      outline-offset: 3px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-right: auto;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 14px;
      color: white;
      background: linear-gradient(145deg, #7467f0, #4b3ac8);
      box-shadow: 0 8px 18px rgba(76, 59, 201, 0.25);
    }

    .level-pill {
      display: none;
      min-height: 42px;
      align-items: center;
      padding: 8px 13px;
      border-radius: 999px;
      color: var(--purple-dark);
      font-size: 0.88rem;
      font-weight: 900;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 18px rgba(54, 44, 126, 0.08);
    }

    .level-pill.visible {
      display: flex;
    }

    .start-levels {
      display: grid;
      gap: 12px;
      width: min(100%, 390px);
      margin: 22px auto 0;
    }

    .level-choice-button {
      display: flex;
      min-height: 66px;
      align-items: center;
      gap: 14px;
      padding: 11px 18px;
      border: 3px solid #dedafc;
      border-radius: 18px;
      color: var(--ink);
      text-align: left;
      background: #f8f7ff;
      box-shadow: 0 5px 0 #dedafc;
    }

    .level-choice-button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #dedafc;
    }

    .level-choice-number {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-weight: 950;
      background: var(--purple);
    }

    .level-choice-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-weight: 950;
    }

    .level-choice-copy small {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 750;
    }

    .level-switcher-backdrop {
      position: fixed;
      z-index: 300;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      background: rgba(36, 48, 71, 0.52);
      backdrop-filter: blur(8px);
    }

    .level-switcher {
      width: min(100%, 430px);
      padding: 24px;
      border-radius: 26px;
      background: white;
      box-shadow: 0 24px 70px rgba(25, 20, 70, 0.3);
    }

    .level-switcher h2 {
      margin-bottom: 17px;
      text-align: center;
    }

    .close-level-switcher {
      width: 100%;
      min-height: 48px;
      margin-top: 16px;
      border-radius: 15px;
      color: var(--purple-dark);
      font-weight: 900;
      background: var(--purple-soft);
    }

    .screen {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1;
      flex-direction: column;
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }

    .card {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      margin: auto 0;
      padding: clamp(22px, 5vw, 38px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 30px;
      background: var(--paper);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero {
      text-align: center;
    }

    .hero-orbit {
      position: relative;
      display: grid;
      width: 140px;
      height: 140px;
      margin: 2px auto 18px;
      place-items: center;
      border-radius: 50%;
      font-size: 70px;
      background: linear-gradient(145deg, #fff5c9, #ffe18a);
      box-shadow: inset 0 -8px 0 rgba(240, 170, 45, 0.13), 0 16px 30px rgba(240, 170, 45, 0.2);
      animation: hero-bob 3s ease-in-out infinite;
    }

    @keyframes hero-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(2rem, 8vw, 3.5rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    h2 {
      margin-bottom: 10px;
      font-size: clamp(1.55rem, 5.8vw, 2.4rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .subtitle {
      max-width: 470px;
      margin-right: auto;
      margin-bottom: 24px;
      margin-left: auto;
      color: var(--muted);
      font-size: clamp(1rem, 3.8vw, 1.2rem);
      line-height: 1.5;
    }

    .primary-button,
    .secondary-button {
      display: inline-flex;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px 24px;
      border-radius: 18px;
      font-weight: 900;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .primary-button {
      color: white;
      background: linear-gradient(145deg, #7062ef, #4b3ac8);
      box-shadow: 0 10px 0 #392ba0, 0 17px 28px rgba(76, 59, 201, 0.24);
    }

    .primary-button:active {
      transform: translateY(5px);
      box-shadow: 0 5px 0 #392ba0, 0 10px 20px rgba(76, 59, 201, 0.2);
    }

    .secondary-button {
      color: var(--purple-dark);
      background: var(--purple-soft);
    }

    .secondary-button:active {
      transform: scale(0.97);
    }

    .wide-button {
      width: min(100%, 360px);
    }

    .resume-note {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .progress-wrap {
      margin-bottom: 22px;
    }

    .progress-copy {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 850;
    }

    .progress-track {
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #ececf4;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mint), #36bad5);
      transition: width 350ms cubic-bezier(.2, .8, .2, 1);
    }

    .round-card {
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      min-height: 0;
      min-width: 0;
      max-width: 100%;
      padding: clamp(19px, 4.8vw, 34px);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--purple);
      font-size: 0.82rem;
      font-weight: 950;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .helper {
      margin-bottom: 20px;
      color: var(--muted);
      line-height: 1.45;
    }

    .sentence {
      max-width: 100%;
      margin: 10px 0 26px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.42rem, 5.4vw, 2rem);
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .drop-zone {
      display: inline-flex;
      min-width: 108px;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      margin: 0 4px;
      padding: 2px 12px;
      border: 3px dashed #9e95ee;
      border-radius: 14px;
      color: var(--purple-dark);
      font-family: ui-rounded, system-ui, sans-serif;
      font-size: 1.03rem;
      vertical-align: middle;
      background: var(--purple-soft);
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
    }

    .drop-zone.ready {
      border-style: solid;
      background: #ddd9ff;
      transform: scale(1.04);
    }

    .drop-zone.drag-over {
      border-color: #2fa879;
      background: #dff9ef;
      transform: scale(1.08);
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      min-width: 0;
      margin-top: 4px;
    }

    .word-choice {
      display: flex;
      min-width: 0;
      min-height: 92px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 5px;
      border: 3px solid transparent;
      border-radius: 20px;
      color: var(--ink);
      background: #f6f5ff;
      box-shadow: 0 6px 0 #dfdcf7;
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .word-choice .word {
      overflow: hidden;
      max-width: 100%;
      font-size: clamp(0.84rem, 3.4vw, 1.08rem);
      font-weight: 900;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .word-choice.selected {
      border-color: var(--purple);
      background: #ece9ff;
      box-shadow: 0 6px 0 #b8b0ed;
      transform: translateY(-3px);
    }

    .drag-ghost {
      position: fixed;
      z-index: 99;
      display: flex;
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(-2deg);
      opacity: 0.93;
      border: 3px solid var(--purple);
      border-radius: 18px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--ink);
      font-weight: 900;
      background: white;
      box-shadow: 0 18px 35px rgba(54, 44, 126, 0.25);
      transition: transform 100ms ease, background 100ms ease;
    }

    .drag-ghost.snapped {
      transform: translate(-50%, -50%) scale(1.02);
      background: #dff9ef;
    }

    .audio-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0 18px;
    }

    .sound-button {
      display: inline-flex;
      min-width: 168px;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 12px 22px;
      border: 3px solid #d9d5fb;
      border-radius: 999px;
      color: var(--purple-dark);
      font-weight: 900;
      background: #f8f7ff;
    }

    .sound-button:active {
      transform: scale(0.97);
    }

    .play-icon {
      display: inline-block;
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 15px solid currentColor;
    }

    .slots-wrap {
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--letter-count), minmax(0, 52px));
      justify-content: center;
      gap: clamp(3px, 1.2vw, 9px);
      width: 100%;
      margin: 6px auto 22px;
      cursor: text;
    }

    .letter-slot {
      display: grid;
      width: 100%;
      min-width: 0;
      height: clamp(50px, 13vw, 68px);
      place-items: center;
      border-bottom: 5px solid #9389e7;
      border-radius: 10px 10px 4px 4px;
      font-size: clamp(1.5rem, 7vw, 2.15rem);
      font-weight: 950;
      text-transform: lowercase;
      background: #f8f7ff;
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }

    .letter-slot.selected {
      border-color: var(--purple);
      background: var(--purple-soft);
      box-shadow: 0 0 0 4px rgba(98, 84, 231, 0.2);
      transform: translateY(-3px);
    }

    .letter-slot.correct {
      border-color: #218b63;
      color: #0d6243;
      background: #c9f3df;
      box-shadow: inset 0 -4px 0 rgba(22, 123, 86, 0.12);
    }

    .letter-slot.misplaced {
      border-color: #d49a20;
      color: #7a4b00;
      background: #ffecad;
      box-shadow: inset 0 -4px 0 rgba(160, 105, 0, 0.12);
      cursor: grab;
      touch-action: none;
    }

    .letter-slot.misplaced:active {
      cursor: grabbing;
    }

    .letter-slot.drag-over {
      border-color: var(--purple);
      background: #ddd9ff;
      transform: scale(1.08);
    }

    .letter-drag-ghost {
      position: fixed;
      z-index: 101;
      display: grid;
      pointer-events: none;
      place-items: center;
      border: 3px solid #d49a20;
      border-radius: 12px;
      color: #7a4b00;
      font-size: 2rem;
      font-weight: 950;
      text-transform: lowercase;
      background: #ffecad;
      box-shadow: 0 16px 30px rgba(54, 44, 126, 0.25);
      transform: translate(-50%, -50%) rotate(-5deg) scale(1.05);
      transition: transform 100ms ease, background 100ms ease;
    }

    .letter-drag-ghost.snapped {
      transform: translate(-50%, -50%) scale(1.02);
      background: #ddd9ff;
    }

    .typing-capture {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      border: 0;
      color: transparent;
      font-size: 16px;
      background: transparent;
      caret-color: transparent;
    }

    .plain-input {
      display: block;
      width: min(100%, 390px);
      min-height: 68px;
      margin: 8px auto 22px;
      padding: 10px 18px;
      border: 3px solid #c9c4f6;
      border-radius: 18px;
      color: var(--ink);
      font-size: clamp(1.3rem, 6vw, 2rem);
      font-weight: 900;
      text-align: center;
      text-transform: lowercase;
      background: #fbfaff;
      caret-color: var(--purple);
    }

    .plain-input:focus {
      border-color: var(--purple);
    }

    .action-row {
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }

    .feedback {
      min-height: 30px;
      margin: 12px 0 0;
      color: var(--muted);
      font-weight: 850;
      text-align: center;
    }

    .feedback.good { color: #167b56; }
    .feedback.try { color: #b64f47; }

    .letter-recap {
      display: grid;
      min-height: 210px;
      place-items: center;
      text-align: center;
    }

    .letter-recap-word {
      display: flex;
      width: 100%;
      min-width: 0;
      align-items: baseline;
      justify-content: center;
      gap: clamp(2px, 1vw, 8px);
      min-height: 86px;
      color: var(--ink);
      font-size: clamp(1.6rem, 8vw, 5rem);
      font-weight: 850;
      letter-spacing: 0.01em;
      text-transform: lowercase;
    }

    .recap-letter {
      display: inline-block;
      transition: color 50ms ease, transform 50ms ease;
    }

    .recap-letter.active {
      color: var(--purple-dark);
      font-weight: 950;
      text-decoration: underline;
      text-decoration-thickness: 0.12em;
      text-underline-offset: 0.14em;
      transform: scale(1.18);
    }

    .letter-recap-word.tornado {
      animation: tornado-word 1.55s cubic-bezier(.45, 0, .3, 1);
    }

    @keyframes tornado-word {
      0% { transform: translateY(0) rotate(0) scale(1); }
      20% { transform: translateY(-22px) rotate(150deg) scale(0.78); }
      45% { transform: translateY(15px) rotate(330deg) scale(1.12); }
      70% { transform: translateY(-10px) rotate(540deg) scale(0.82); }
      100% { transform: translateY(0) rotate(720deg) scale(1); }
    }

    .letter-recap-word.rolling {
      animation: rolling-word 1.65s cubic-bezier(.25, .7, .25, 1);
    }

    @keyframes rolling-word {
      0% { transform: translateX(-24%) rotate(-360deg) scale(0.86); }
      48% { transform: translateX(20%) rotate(310deg) scale(1.06); }
      78% { transform: translateX(-5%) rotate(620deg) scale(0.96); }
      100% { transform: translateX(0) rotate(720deg) scale(1); }
    }

    .correction-backdrop {
      position: fixed;
      z-index: 350;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      background: rgba(36, 48, 71, 0.58);
      backdrop-filter: blur(8px);
    }

    .correction-dialog {
      width: min(100%, 430px);
      padding: clamp(24px, 6vw, 36px);
      border-radius: 28px;
      text-align: center;
      background: white;
      box-shadow: 0 24px 70px rgba(25, 20, 70, 0.32);
      animation: pop 300ms cubic-bezier(.2, 1.2, .5, 1);
    }

    .correction-word {
      margin: 22px 0 28px;
      color: var(--ink);
      font-size: clamp(1.5rem, 8vw, 2.35rem);
      letter-spacing: 0.03em;
      text-transform: lowercase;
    }

    .corrected-letter {
      color: var(--purple-dark);
      font-weight: 950;
      text-decoration: underline;
      text-decoration-thickness: 0.12em;
      text-underline-offset: 0.14em;
    }

    .shake {
      animation: shake 320ms ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-4px); }
    }

    .success-panel,
    .level-panel {
      text-align: center;
    }

    @keyframes pop {
      from { transform: scale(0.2) rotate(-12deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }

    .stars-earned {
      margin: 15px 0 24px;
      color: #efad28;
      font-size: 1.08rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .level-map {
      display: grid;
      gap: 10px;
      margin: 22px 0 26px;
      text-align: left;
    }

    .map-step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      color: var(--muted);
      background: #f4f3fa;
    }

    .map-step.done,
    .map-step.current {
      color: var(--ink);
      font-weight: 850;
    }

    .map-step.current {
      background: var(--purple-soft);
    }

    .map-number {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      color: white;

<body>
  <main class="app">
    <header class="topbar">
      <a class="home-link" href="../index.html">Back to All Subjects</a>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">Aa</span>
        <span class="brand-text">Spelling Quest</span>
      </div>
      <button class="level-pill" id="levelPill" type="button" aria-label="Change level" aria-haspopup="dialog"></button>
      <button class="home-link" id="miniGamesButton" type="button">Mini Games</button>
    </header>
    <section class="screen" id="screen" aria-live="polite"></section>
  </main>

  <script>
    "use strict";

    const WORDS = [
      { word: "yelled", sentence: "He ___ loudly for help." },
      { word: "yanked", sentence: "She ___ hard on the rope." },
      { word: "slumped", sentence: "The tired player ___ into the chair." },
      { word: "limped", sentence: "The hurt dog ___ slowly home." },
      { word: "plopped", sentence: "The frog ___ onto the lily pad." },
      { word: "smiled", sentence: "She ___ for the picture." },
      { word: "shrugged", sentence: "He ___ when he did not know." },
      { word: "liked", sentence: "I really ___ that funny book." },
      { word: "patted", sentence: "She gently ___ the friendly dog." },
      { word: "you", sentence: "___ are my best friend." }
    ];

    const STORAGE_KEY = "mobile-spelling-quest-v2";
    const screen = document.getElementById("screen");
    const topbar = document.querySelector(".topbar");
    const levelPill = document.getElementById("levelPill");
    const audio = new Audio();
    audio.preload = "auto";
    const effectAudio = new Audio();
    effectAudio.preload = "auto";
    const keyAudio = new Audio();
    keyAudio.preload = "auto";

    const isIPad = /iPad/i.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    document.body.classList.toggle("is-ipad", isIPad);

    let state = loadState();
    let selectedWord = null;
    let locked = false;
    let viewVersion = 0;
    let effectPlaybackId = 0;

    function shuffled(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
      }
      return copy;
    }

    function freshState() {
      const newStreaks = () => Object.fromEntries(WORDS.map((item) => [item.word, 0]));
      return {
        started: false,
        level: 1,
        rounds: { 1: 0, 2: 0, 3: 0 },
        orders: {
          1: shuffled(WORDS.map((item) => item.word)),
          2: shuffled(WORDS.map((item) => item.word)),
          3: shuffled(WORDS.map((item) => item.word))
        },
        mastered: { 1: [], 2: [], 3: [] },
        streaks: { 1: newStreaks(), 2: newStreaks(), 3: newStreaks() },
        roundHadError: { 1: false, 2: false, 3: false }
      };
    }

    function validOrder(order) {
      return Array.isArray(order)
        && order.length >= WORDS.length
        && order.every((word) => wordData(word))
        && WORDS.every((item) => order.includes(item.word));
    }

    function validMastered(list) {
      return Array.isArray(list)
        && new Set(list).size === list.length
        && list.every((word) => wordData(word));
    }

    function validStreaks(streaks) {
      return streaks
        && WORDS.every((item) => Number.isInteger(streaks[item.word])
          && streaks[item.word] >= 0
          && streaks[item.word] <= 3);
    }

    function inferMastered(saved, rounds) {
      const mastered = { 1: [], 2: [], 3: [] };
      [1, 2, 3].forEach((level) => {
        if (saved.level > level) {
          mastered[level] = WORDS.map((item) => item.word);
        } else {
          mastered[level] = [...new Set(saved.orders[level].slice(0, rounds[level]))];
        }
      });
      return mastered;
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (
          saved
          && Number.isInteger(saved.level)
          && saved.level >= 1
          && saved.level <= 4
          && saved.orders
          && validOrder(saved.orders[1])
          && validOrder(saved.orders[2])
          && validOrder(saved.orders[3])
          && saved.streaks
          && validStreaks(saved.streaks[1])
          && validStreaks(saved.streaks[2])
          && validStreaks(saved.streaks[3])
        ) {
          const hasValidRounds = saved.rounds
            && [1, 2, 3].every((level) => Number.isInteger(saved.rounds[level])
              && saved.rounds[level] >= 0
              && saved.rounds[level] <= saved.orders[level].length);
          const oldRound = Number.isInteger(saved.round) && saved.round >= 0 ? saved.round : 0;
          const rounds = hasValidRounds ? saved.rounds : { 1: 0, 2: 0, 3: 0 };
          if (!hasValidRounds) {
            [1, 2, 3].forEach((level) => {
              rounds[level] = saved.level > level
                ? saved.orders[level].length
                : saved.level === level
                  ? Math.min(oldRound, saved.orders[level].length)
                  : 0;
            });
          }
          saved.rounds = rounds;
          saved.mastered = {
            1: WORDS.filter((item) => saved.streaks[1][item.word] === 3).map((item) => item.word),
            2: WORDS.filter((item) => saved.streaks[2][item.word] === 3).map((item) => item.word),
            3: WORDS.filter((item) => saved.streaks[3][item.word] === 3).map((item) => item.word)
          };
          const oldRoundHadError = Boolean(saved.roundHadError);
          saved.roundHadError = saved.roundHadError
            && typeof saved.roundHadError === "object"
            ? {
                1: Boolean(saved.roundHadError[1]),
                2: Boolean(saved.roundHadError[2]),
                3: Boolean(saved.roundHadError[3])
              }
            : {
                1: saved.level === 1 && oldRoundHadError,
                2: saved.level === 2 && oldRoundHadError,
                3: saved.level === 3 && oldRoundHadError
              };
          delete saved.round;
          return saved;
        }
      } catch (error) {
        console.info("Starting a new quest because saved progress could not be read.");
      }
      return freshState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.info("Progress could not be saved on this device.");
      }
    }

    function currentRound() {
      return state.rounds[state.level];
    }

    function recordIncorrectAttempt() {
      if (state.roundHadError[state.level]) return;
      state.roundHadError[state.level] = true;
      saveState();
    }

    function queueWordForRetry(word) {
      const order = state.orders[state.level];
      const round = currentRound();
      const earliestPosition = round + 1 < order.length
        ? round + 2
        : round + 1;
      const openPositions = order.length - earliestPosition + 1;
      const insertAt = earliestPosition + Math.floor(Math.random() * openPositions);
      order.splice(insertAt, 0, word);
    }

    function advanceAfterCorrect(word) {
      const needsRetry = state.roundHadError[state.level];
      let streak = state.streaks[state.level][word];
      if (needsRetry) {
        streak = 0;
        state.streaks[state.level][word] = 0;
        queueWordForRetry(word);
      } else {
        streak = Math.min(3, streak + 1);
        state.streaks[state.level][word] = streak;
        if (streak === 3) {
          if (!state.mastered[state.level].includes(word)) {
            state.mastered[state.level].push(word);
          }
        } else {
          queueWordForRetry(word);
        }
      }
      state.roundHadError[state.level] = false;
      state.rounds[state.level] += 1;
      return {
        needsRetry,
        streak,
        masteredNow: !needsRetry && streak === 3
      };
    }

    function wordData(word) {
      return WORDS.find((item) => item.word === word);
    }

    function currentWord() {
      return wordData(state.orders[state.level][currentRound()]);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function positionGhost(ghost, x, y) {
      const transformAllowance = 8;
      const halfWidth = ghost.offsetWidth / 2 + transformAllowance;
      const halfHeight = ghost.offsetHeight / 2 + transformAllowance;
      ghost.style.left = `${Math.max(halfWidth, Math.min(window.innerWidth - halfWidth, x))}px`;
      ghost.style.top = `${Math.max(halfHeight, Math.min(window.innerHeight - halfHeight, y))}px`;
    }

    function stopAllAudio() {
      effectPlaybackId += 1;
      audio.pause();
      audio.onended = null;
      audio.onerror = null;
      effectAudio.pause();
      effectAudio.onended = null;
      effectAudio.onerror = null;
      effectAudio.onplaying = null;
      keyAudio.pause();
      keyAudio.onerror = null;
    }

    function playTypedLetter(value) {
      const letters = String(value || "").toLowerCase().replace(/[^a-z]/g, "");
      const letter = letters.at(-1);
      if (!letter) return;

      audio.pause();
      audio.onended = null;
      audio.onerror = null;
      keyAudio.pause();
      keyAudio.onerror = null;
      keyAudio.src = `sounds/letters/${letter}.mp3`;
      keyAudio.currentTime = 0;
      keyAudio.playbackRate = 1;
      const promise = keyAudio.play();
      if (promise) promise.catch(() => {});
    }

    function playAudio(word) {
      keyAudio.pause();
      keyAudio.onerror = null;
      audio.pause();
      audio.onended = null;
      audio.onerror = null;
      audio.src = `sounds/words/${word}.mp3`;
      audio.currentTime = 0;
      audio.playbackRate = 1;
      const promise = audio.play();
      if (promise) {
        promise.catch(() => {
          const feedback = document.getElementById("feedback");
          if (feedback) {
            feedback.textContent = "Tap the play button to hear the word.";
          }
        });
      }
    }

    function playWordForRecap(word, onEnded) {
      let settled = false;
      const finish = () => {
        if (settled) return;
        settled = true;
        audio.onended = null;
        audio.onerror = null;
        onEnded();
      };

      audio.pause();
      audio.onended = finish;
      audio.onerror = finish;
      audio.src = `sounds/words/${word}.mp3`;
      audio.currentTime = 0;
      audio.playbackRate = 1;
      const promise = audio.play();
      if (promise) promise.catch(finish);
    }

    function playEffect(name, onEnded = null) {
      const playbackId = ++effectPlaybackId;
      let settled = false;
      const finish = () => {
        if (settled || playbackId !== effectPlaybackId) return;
        settled = true;
        effectAudio.onended = null;
        effectAudio.onerror = null;
        if (onEnded) onEnded();
      };

      effectAudio.pause();
      effectAudio.onended = null;
      effectAudio.onerror = null;
      effectAudio.onplaying = null;
      effectAudio.src = `sounds/other/${name}.mp3`;
      effectAudio.currentTime = 0;
      effectAudio.playbackRate = 1;
      if (onEnded) {
        effectAudio.onended = finish;
        effectAudio.onerror = finish;
      }
      const promise = effectAudio.play();
      if (promise) promise.catch(finish);
    }

    function levelName(level) {
      return {
        1: "Sentence Match",
        2: "Letter Builder",
        3: "Super Speller"
      }[level] || "Quest Complete";
    }

    function updateHeader(showLevel = false) {
      topbar.classList.toggle("hidden", !showLevel);
      levelPill.classList.toggle("visible", showLevel);
      levelPill.textContent = showLevel ? `Level ${state.level} · ${levelName(state.level)}` : "";
    }

    function levelProgressText(level) {
      const mastered = state.mastered[level].length;
      if (mastered === WORDS.length) return "Complete · tap to replay";
      if (state.rounds[level] > 0) return `${mastered} of ${WORDS.length} mastered`;
      return "Start this level";
    }

    function levelButtonsMarkup() {
      return [1, 2, 3].map((level) => `
        <button class="level-choice-button" data-select-level="${level}">
          <span class="level-choice-number">${level}</span>
          <span class="level-choice-copy">
            <span>${levelName(level)}</span>
            <small>${levelProgressText(level)}</small>
          </span>
        </button>
      `).join("");
    }

    function resetLevel(level) {
      state.orders[level] = shuffled(WORDS.map((item) => item.word));
      state.mastered[level] = [];
      state.streaks[level] = Object.fromEntries(WORDS.map((item) => [item.word, 0]));
      state.rounds[level] = 0;
      state.roundHadError[level] = false;
    }

    function selectLevel(level) {
      if (state.mastered[level].length === WORDS.length) resetLevel(level);
      state.level = level;
      state.started = true;
      saveState();
      document.querySelector(".level-switcher-backdrop")?.remove();
      renderRound({ autoplay: level > 1 });
    }

    function wireLevelButtons(container = document) {
      container.querySelectorAll("[data-select-level]").forEach((button) => {
        button.addEventListener("click", () => selectLevel(Number(button.dataset.selectLevel)));
      });
    }

    function openLevelMenu() {
      if (document.querySelector(".level-switcher-backdrop")) return;
      const backdrop = document.createElement("div");
      backdrop.className = "level-switcher-backdrop";
      backdrop.setAttribute("role", "dialog");
      backdrop.setAttribute("aria-modal", "true");
      backdrop.setAttribute("aria-labelledby", "levelSwitcherTitle");
      backdrop.innerHTML = `
        <div class="level-switcher">
          <h2 id="levelSwitcherTitle">Choose a level</h2>
          <div class="start-levels">${levelButtonsMarkup()}<button class="level-choice-button" data-open-minis><span class="level-choice-number" aria-hidden="true">✦</span><span class="level-choice-copy">Mini Games</span></button></div>
          <button class="close-level-switcher" type="button">Keep Playing</button>
        </div>
      `;
      document.body.appendChild(backdrop);
      wireLevelButtons(backdrop);
      const close = () => backdrop.remove();
      backdrop.querySelector(".close-level-switcher").addEventListener("click", close);
      backdrop.addEventListener("pointerdown", (event) => {
        if (event.target === backdrop) close();
      });
      backdrop.querySelector("[data-select-level]")?.focus();
    }

    function renderStart() {
      if ([1, 2, 3].every((level) => state.mastered[level].length === WORDS.length)) {
        state.level = 4;
        saveState();
        renderComplete();
        return;
      }
      updateHeader(false);
      screen.innerHTML = `
        <div class="card hero">
          <h1>Spelling Quest</h1>
          <div class="start-levels">${levelButtonsMarkup()}<button class="level-choice-button" data-open-minis><span class="level-choice-number" aria-hidden="true">✦</span><span class="level-choice-copy">Mini Games</span></button></div>
        </div>
      `;
      wireLevelButtons(screen);
      screen.querySelector("[data-open-minis]")?.addEventListener("click", renderMiniBoard);
    }

    function progressMarkup() {
      const completed = state.mastered[state.level].length;
      const percent = (completed / WORDS.length) * 100;
      return `
        <div class="progress-wrap">
          <div class="progress-copy">
            <span>${completed} of ${WORDS.length} words mastered</span>
            <span>${completed} stars earned</span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Level progress" aria-valuemin="0" aria-valuemax="${WORDS.length}" aria-valuenow="${completed}">
            <div class="progress-fill" style="width: ${percent}%"></div>
          </div>
        </div>
      `;
    }

    function renderRound(options = {}) {
      stopAllAudio();
      viewVersion += 1;
      selectedWord = null;
      locked = false;
      updateHeader(true);

      if (currentRound() >= state.orders[state.level].length) {
        renderLevelComplete();
        return;
      }

      if (state.level === 1) {
        renderSentenceRound();
      } else if (state.level === 2) {
        renderSlotRound();
      } else {
        renderBlankRound();
      }

      if (options.autoplay && state.level > 1) {
        playAudio(currentWord().word);
      }
    }

    function renderSentenceRound() {
      const target = currentWord();
      const distractors = shuffled(WORDS.filter((item) => item.word !== target.word)).slice(0, 2);
      const choices = shuffled([target, ...distractors]);
      const sentenceParts = target.sentence.split("___");

      screen.innerHTML = `
        ${progressMarkup()}
        <div class="round-card" id="roundCard">
          <h2>Finish the sentence</h2>
          <p class="sentence">
            ${escapeHtml(sentenceParts[0])}<button class="drop-zone" id="dropZone" aria-label="Sentence blank">blank</button>${escapeHtml(sentenceParts[1] || "")}
          </p>
          <div class="choices" id="choices">
            ${choices.map((item) => `
              <button class="word-choice" data-word="${item.word}" aria-label="${item.word}" aria-pressed="false">
                <span class="word">${item.word}</span>
              </button>
            `).join("")}
          </div>
          <p class="feedback" id="feedback" aria-live="assertive"></p>
        </div>
      `;

      const dropZone = document.getElementById("dropZone");
      dropZone.addEventListener("click", () => {
        if (!selectedWord || locked) return;
        checkAnswer(selectedWord);
      });

      document.querySelectorAll(".word-choice").forEach((choice) => {
        attachChoiceEvents(choice, dropZone);
      });
    }

    function attachChoiceEvents(choice, dropZone) {
      let startX = 0;
      let startY = 0;
      let dragging = false;
      let ghost = null;
      let suppressClick = false;
      const isNearDrop = (x, y) => {
        const rect = dropZone.getBoundingClientRect();
        const margin = 22;
        return x >= rect.left - margin
          && x <= rect.right + margin
          && y >= rect.top - margin
          && y <= rect.bottom + margin;
      };

      choice.addEventListener("pointerdown", (event) => {
        if (locked || event.button > 0) return;
        startX = event.clientX;
        startY = event.clientY;
        dragging = false;
        suppressClick = false;
        choice.setPointerCapture(event.pointerId);
        playAudio(choice.dataset.word);
      });

      choice.addEventListener("pointermove", (event) => {
        if (!choice.hasPointerCapture(event.pointerId) || locked) return;
        const distance = Math.hypot(event.clientX - startX, event.clientY - startY);
        if (distance < 9 && !dragging) return;

        if (!dragging) {
          dragging = true;
          suppressClick = true;
          const item = wordData(choice.dataset.word);
          const dropRect = dropZone.getBoundingClientRect();
          ghost = document.createElement("div");
          ghost.className = "drag-ghost";
          ghost.textContent = item.word;
          ghost.style.width = `${dropRect.width}px`;
          ghost.style.height = `${dropRect.height}px`;
          document.body.appendChild(ghost);
        }

        const rect = dropZone.getBoundingClientRect();
        const over = isNearDrop(event.clientX, event.clientY);
        ghost.classList.toggle("snapped", over);
        positionGhost(
          ghost,
          over ? rect.left + rect.width / 2 : event.clientX,
          over ? rect.top + rect.height / 2 : event.clientY
        );
        dropZone.classList.toggle("drag-over", over);
      });

      choice.addEventListener("pointerup", (event) => {
        if (choice.hasPointerCapture(event.pointerId)) {
          choice.releasePointerCapture(event.pointerId);
        }
        if (ghost) ghost.remove();
        dropZone.classList.remove("drag-over");

        if (dragging) {
          if (isNearDrop(event.clientX, event.clientY)) checkAnswer(choice.dataset.word);
        }
      });

      choice.addEventListener("pointercancel", () => {
        if (ghost) ghost.remove();
        dropZone.classList.remove("drag-over");
      });

      choice.addEventListener("click", () => {
        if (locked || suppressClick) {
          suppressClick = false;
          return;
        }
        document.querySelectorAll(".word-choice").forEach((item) => item.classList.remove("selected"));
        document.querySelectorAll(".word-choice").forEach((item) => item.setAttribute("aria-pressed", "false"));
        choice.classList.add("selected");
        choice.setAttribute("aria-pressed", "true");
        selectedWord = choice.dataset.word;
        dropZone.textContent = selectedWord;
        dropZone.setAttribute("aria-label", `Sentence blank filled with ${selectedWord}. Tap to submit.`);
        dropZone.classList.add("ready");
        document.getElementById("feedback").textContent = "Now tap the blank to place it.";
      });

      choice.addEventListener("keydown", (event) => {
        if ((event.key === "Enter" || event.key === " ") && !locked) {
          playAudio(choice.dataset.word);
        }
      });
    }

    function renderSlotRound() {
      const target = currentWord();
      screen.innerHTML = `
        ${progressMarkup()}
        <div class="round-card" id="roundCard">
          <p class="eyebrow">Listen and spell</p>
          <h2>Build the word</h2>
          <div class="audio-stage">
            <button class="sound-button" id="soundButton" aria-label="Play the spelling word again">
              <span class="play-icon" aria-hidden="true"></span>
              Hear the word
            </button>
          </div>
          <div class="slots-wrap" id="slotsWrap" style="--letter-count: ${target.word.length}" role="group" aria-label="${target.word.length} letter spaces. Tap a space to type there.">
            ${Array.from({ length: target.word.length }, (_, index) => `<span class="letter-slot" data-index="${index}" tabindex="0" role="button" aria-label="Letter space ${index + 1}, blank"></span>`).join("")}
            <input
              class="typing-capture"
              id="spellInput"
              type="text"
              inputmode="text"
              enterkeyhint="done"
              autocapitalize="none"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
              aria-label="Type the ${target.word.length} letter word"
            >
          </div>
          <div class="action-row">
            <button class="primary-button wide-button" id="checkButton">Check My Word</button>
          </div>
          <p class="feedback" id="feedback" aria-live="assertive"></p>
        </div>
      `;
      wireSpellingInput(target, true);
    }

    function renderBlankRound() {
      const target = currentWord();
      screen.innerHTML = `
        ${progressMarkup()}
        <div class="round-card" id="roundCard">
          <p class="eyebrow">Final challenge</p>
          <h2>Spell what you hear</h2>
          <div class="audio-stage">
            <button class="sound-button" id="soundButton" aria-label="Play the spelling word again">
              <span class="play-icon" aria-hidden="true"></span>
              Hear the word
            </button>
          </div>
          <input
            class="plain-input"
            id="spellInput"
            type="text"
            inputmode="text"
            enterkeyhint="done"
            autocapitalize="none"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Type the word you hear"
            placeholder="type the word"
          >
          <div class="action-row">
            <button class="primary-button wide-button" id="checkButton">Check My Word</button>
          </div>
          <p class="feedback" id="feedback" aria-live="assertive"></p>
        </div>
      `;
      wireSpellingInput(target, false);
    }

    function showCorrectionPopup(target, attempt, input, feedback) {
      if (document.querySelector(".correction-backdrop")) return;
      input.blur();
      const correctedWord = [...target.word].map((letter, index) => {
        const safeLetter = escapeHtml(letter);
        return attempt[index] === letter
          ? `<span>${safeLetter}</span>`
          : `<strong class="corrected-letter">${safeLetter}</strong>`;
      }).join("");

      const backdrop = document.createElement("div");
      backdrop.className = "correction-backdrop";
      backdrop.setAttribute("role", "alertdialog");
      backdrop.setAttribute("aria-modal", "true");
      backdrop.setAttribute("aria-labelledby", "correctionTitle");
      backdrop.setAttribute("aria-describedby", "correctionWord");
      backdrop.innerHTML = `
        <div class="correction-dialog">
          <p class="eyebrow">Correct spelling</p>
          <h2 id="correctionTitle">Look closely</h2>
          <div class="correction-word" id="correctionWord" aria-label="The correct spelling is ${escapeHtml(target.word)}">
            ${correctedWord}
          </div>
          <button class="primary-button wide-button" id="tryAgainButton">Try again.</button>
        </div>
      `;
      document.body.appendChild(backdrop);

      const tryAgainButton = document.getElementById("tryAgainButton");
      tryAgainButton.addEventListener("click", () => {
        backdrop.remove();
        input.value = "";
        input.dataset.previousValue = "";
        feedback.textContent = "";
        feedback.className = "feedback";
        input.focus();
      });
      tryAgainButton.focus();
    }

    function wireSpellingInput(target, hasSlots) {
      const input = document.getElementById("spellInput");
      const feedback = document.getElementById("feedback");
      const roundCard = document.getElementById("roundCard");

      document.getElementById("soundButton").addEventListener("click", () => playAudio(target.word));

      if (hasSlots) {
        wireSlotSpellingInput(target, input, feedback, roundCard);
        return;
      }

      input.dataset.previousValue = input.value;
      input.addEventListener("input", (event) => {
        const previousValue = input.dataset.previousValue || "";
        const explicitDelete = event.inputType?.startsWith("delete");
        const inferredDelete = !event.inputType
          && event.data == null
          && input.value.length < previousValue.length;
        if (!explicitDelete && !inferredDelete) {
          let firstDifference = 0;
          while (
            firstDifference < previousValue.length
            && previousValue[firstDifference] === input.value[firstDifference]
          ) {
            firstDifference += 1;
          }
          const insertedLength = Math.max(1, input.value.length - previousValue.length);
          const inserted = event.data
            || input.value.slice(firstDifference, firstDifference + insertedLength)
            || input.value;
          playTypedLetter(inserted);
        }
        input.dataset.previousValue = input.value;
        feedback.textContent = "";
        feedback.className = "feedback";
      });

      const submit = () => {
        if (locked) return;
        const answer = input.value.trim().toLowerCase();
        if (!answer) {
          feedback.textContent = "Type your best spelling first.";
          feedback.className = "feedback try";
          input.focus();
          return;
        }
        if (answer === target.word) {
          checkAnswer(answer);
        } else {
          recordIncorrectAttempt();
          roundCard.classList.remove("shake");
          void roundCard.offsetWidth;
          roundCard.classList.add("shake");
          showCorrectionPopup(target, answer, input, feedback);
        }
      };

      document.getElementById("checkButton").addEventListener("click", submit);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          submit();
        }
      });

      input.focus();
    }

    function evaluateLetters(letters, targetWord) {
      const results = Array(letters.length).fill("absent");
      const remaining = {};

      letters.forEach((letter, index) => {
        if (letter === targetWord[index]) {
          results[index] = "correct";
        } else {
          remaining[targetWord[index]] = (remaining[targetWord[index]] || 0) + 1;
        }
      });

      letters.forEach((letter, index) => {
        if (results[index] === "correct") return;
        if (remaining[letter] > 0) {
          results[index] = "misplaced";
          remaining[letter] -= 1;
        }
      });

      return results;
    }

    function wireSlotSpellingInput(target, input, feedback, roundCard) {
      const slots = [...document.querySelectorAll(".letter-slot")];
      const letters = Array(target.word.length).fill("");
      const statuses = Array(target.word.length).fill("empty");
      let selectedIndex = null;
      let dragState = null;
      let ignoreClicksUntil = 0;
      const captureSentinel = "\u200B";

      const resetCaptureInput = () => {
        input.value = captureSentinel;
        input.setSelectionRange(input.value.length, input.value.length);
      };

      const focusKeyboard = () => {
        resetCaptureInput();
        input.focus({ preventScroll: true });
      };

      const renderSlots = () => {
        slots.forEach((slot, index) => {
          slot.textContent = letters[index];
          slot.classList.toggle("correct", statuses[index] === "correct");
          slot.classList.toggle("misplaced", statuses[index] === "misplaced");
          slot.classList.toggle("selected", selectedIndex === index);
          const description = letters[index] || "blank";
          const result = statuses[index] === "correct"
            ? ", correct and locked"
            : statuses[index] === "misplaced"
              ? ", correct letter in the wrong place, draggable"
              : "";
          slot.setAttribute("aria-label", `Letter space ${index + 1}, ${description}${result}`);
          slot.setAttribute("aria-disabled", statuses[index] === "correct" ? "true" : "false");
        });
      };

      const chooseSlot = (index) => {
        if (statuses[index] === "correct") return;
        selectedIndex = index;
        renderSlots();
        focusKeyboard();
      };

      const firstBlank = () => letters.findIndex((letter) => !letter);

      const placeLetter = (letter) => {
        let index = selectedIndex;
        if (index === null || statuses[index] === "correct") index = firstBlank();
        if (index < 0) {
          feedback.textContent = "All spaces are full. Tap a letter to replace it.";
          feedback.className = "feedback try";
          return;
        }
        letters[index] = letter;
        statuses[index] = "unmarked";
        selectedIndex = null;
        feedback.textContent = "";
        feedback.className = "feedback";
        renderSlots();
      };

      const removeLetter = () => {
        let index = selectedIndex;
        if (index === null || statuses[index] === "correct" || !letters[index]) {
          index = -1;
          for (let cursor = letters.length - 1; cursor >= 0; cursor -= 1) {
            if (letters[cursor] && statuses[cursor] !== "correct") {
              index = cursor;
              break;
            }
          }
        }
        if (index < 0) return;
        letters[index] = "";
        statuses[index] = "empty";
        selectedIndex = index;
        renderSlots();
      };

      const finishDrag = (event, shouldDrop = true) => {
        if (!dragState) return;
        const { source, ghost, dragging } = dragState;
        if (ghost) ghost.remove();
        slots.forEach((slot) => slot.classList.remove("drag-over"));

        if (dragging && shouldDrop) {
          ignoreClicksUntil = performance.now() + 250;
          const targetSlot = document.elementFromPoint(event.clientX, event.clientY)?.closest(".letter-slot");
          const destination = targetSlot ? Number(targetSlot.dataset.index) : -1;
          if (destination >= 0 && destination !== source && statuses[destination] !== "correct") {
            [letters[source], letters[destination]] = [letters[destination], letters[source]];
            [statuses[source], statuses[destination]] = [statuses[destination], statuses[source]];
            if (!letters[source]) statuses[source] = "empty";
            selectedIndex = null;
            renderSlots();
            feedback.textContent = "Letter moved. Fill any blank spaces, then check again.";
            feedback.className = "feedback";
            focusKeyboard();
          }
        }
        dragState = null;
      };

      slots.forEach((slot, index) => {
        slot.addEventListener("click", () => {
          if (performance.now() < ignoreClicksUntil) return;
          chooseSlot(index);
        });
        slot.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            chooseSlot(index);
          }
        });
        slot.addEventListener("pointerdown", (event) => {
          if (statuses[index] !== "misplaced" || event.button > 0) return;
          slot.setPointerCapture(event.pointerId);
          dragState = {
            source: index,
            startX: event.clientX,
            startY: event.clientY,
            dragging: false,
            ghost: null
          };
        });
        slot.addEventListener("pointermove", (event) => {
          if (!dragState || dragState.source !== index) return;
          const distance = Math.hypot(event.clientX - dragState.startX, event.clientY - dragState.startY);
          if (distance < 8 && !dragState.dragging) return;
          if (!dragState.dragging) {
            dragState.dragging = true;
            const sourceRect = slot.getBoundingClientRect();
            dragState.ghost = document.createElement("span");
            dragState.ghost.className = "letter-drag-ghost";
            dragState.ghost.textContent = letters[index];
            dragState.ghost.style.width = `${sourceRect.width}px`;
            dragState.ghost.style.height = `${sourceRect.height}px`;
            document.body.appendChild(dragState.ghost);
          }
          slots.forEach((item) => item.classList.remove("drag-over"));
          const targetSlot = document.elementFromPoint(event.clientX, event.clientY)?.closest(".letter-slot");
          const validTarget = targetSlot && statuses[Number(targetSlot.dataset.index)] !== "correct";
          dragState.ghost.classList.toggle("snapped", Boolean(validTarget));
          if (validTarget) {
            const targetRect = targetSlot.getBoundingClientRect();
            positionGhost(
              dragState.ghost,
              targetRect.left + targetRect.width / 2,
              targetRect.top + targetRect.height / 2
            );
            targetSlot.classList.add("drag-over");
          } else {
            positionGhost(dragState.ghost, event.clientX, event.clientY);
          }
        });
        slot.addEventListener("pointerup", (event) => {
          if (slot.hasPointerCapture(event.pointerId)) slot.releasePointerCapture(event.pointerId);
          finishDrag(event);
        });
        slot.addEventListener("pointercancel", (event) => finishDrag(event, false));
      });

      input.addEventListener("beforeinput", (event) => {
        if (!event.inputType?.startsWith("delete")) return;
        event.preventDefault();
        removeLetter();
        resetCaptureInput();
      });

      input.addEventListener("input", (event) => {
        const explicitDelete = event.inputType?.startsWith("delete");
        const inferredDelete = !event.inputType
          && event.data == null
          && input.value.replaceAll(captureSentinel, "") === "";
        if (explicitDelete || inferredDelete) {
          removeLetter();
        } else {
          const typed = (event.data || input.value).toLowerCase().replace(/[^a-z]/g, "");
          playTypedLetter(typed);
          [...typed].forEach(placeLetter);
        }
        resetCaptureInput();
      });

      const submit = () => {
        if (locked) return;
        if (letters.some((letter) => !letter)) {
          feedback.textContent = "Fill every letter space before checking.";
          feedback.className = "feedback try";
          selectedIndex = firstBlank();
          renderSlots();
          focusKeyboard();
          return;
        }

        const answer = letters.join("");
        if (answer === target.word) {
          checkAnswer(answer);
          return;
        }

        recordIncorrectAttempt();
        const results = evaluateLetters(letters, target.word);
        results.forEach((result, index) => {
          if (result === "absent") {
            letters[index] = "";
            statuses[index] = "empty";
          } else {
            statuses[index] = result;
          }
        });
        selectedIndex = null;
        renderSlots();
        feedback.textContent = "Green letters are correct. Move the yellow letters, then fill the blanks.";
        feedback.className = "feedback try";
        roundCard.classList.remove("shake");
        void roundCard.offsetWidth;
        roundCard.classList.add("shake");
        playAudio(target.word);
        focusKeyboard();
      };

      document.getElementById("checkButton").addEventListener("click", submit);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Backspace" || event.key === "Delete") {
          event.preventDefault();
          removeLetter();
          resetCaptureInput();
          return;
        }
        if (event.key === "Enter") {
          event.preventDefault();
          submit();
        }
      });

      renderSlots();
      focusKeyboard();
    }

    function playRecapLetter(letter, element, onFinished, expectedViewVersion) {
      const playbackId = ++effectPlaybackId;
      let settled = false;
      let fallbackScheduled = false;
      let fallbackTimer;

      const finish = () => {
        if (settled) return;
        settled = true;
        window.clearTimeout(fallbackTimer);
        if (viewVersion !== expectedViewVersion || playbackId !== effectPlaybackId) {
          element.classList.remove("active");
          return;
        }
        effectAudio.onended = null;
        effectAudio.onerror = null;
        effectAudio.onplaying = null;
        element.classList.remove("active");
        window.setTimeout(onFinished, 35);
      };

      const animateWithoutAudio = () => {
        if (settled || fallbackScheduled) return;
        if (viewVersion !== expectedViewVersion || playbackId !== effectPlaybackId) {
          settled = true;
          window.clearTimeout(fallbackTimer);
          element.classList.remove("active");
          return;
        }
        fallbackScheduled = true;
        window.clearTimeout(fallbackTimer);
        element.classList.add("active");
        fallbackTimer = window.setTimeout(finish, 850);
      };

      effectAudio.pause();
      effectAudio.onended = finish;
      effectAudio.onerror = animateWithoutAudio;
      effectAudio.onplaying = () => element.classList.add("active");
      effectAudio.src = `sounds/letters/${letter.toLowerCase()}.mp3`;
      effectAudio.currentTime = 0;
      effectAudio.playbackRate = 1;

      const promise = effectAudio.play();
      if (promise) {
        promise.catch(animateWithoutAudio);
      }
    }

    function playSpellingPass(target, letters, expectedViewVersion, onFinished) {
      let letterIndex = 0;
      const playNextLetter = () => {
        if (viewVersion !== expectedViewVersion) return;
        if (letterIndex >= letters.length) {
          onFinished();
          return;
        }

        const index = letterIndex;
        letterIndex += 1;
        playRecapLetter(target.word[index], letters[index], playNextLetter, expectedViewVersion);
      };
      playNextLetter();
    }

    function animateRecapWord(element, className, duration, expectedViewVersion, onFinished) {
      if (viewVersion !== expectedViewVersion) return;
      let settled = false;
      let fallbackTimer;
      const finish = () => {
        if (settled) return;
        settled = true;
        window.clearTimeout(fallbackTimer);
        element.removeEventListener("animationend", finish);
        element.classList.remove(className);
        if (viewVersion === expectedViewVersion) onFinished();
      };

      element.addEventListener("animationend", finish);
      element.classList.add(className);
      fallbackTimer = window.setTimeout(finish, duration + 250);
    }

    function showLetterRecap(target, masteryResult, expectedViewVersion, finishedLevel) {
      if (viewVersion !== expectedViewVersion) return;
      const roundCard = document.getElementById("roundCard");
      if (!roundCard) return;

      const spokenLetters = [...target.word].join("-");
      roundCard.innerHTML = `
        <div class="letter-recap">
          <div class="letter-recap-word" aria-label="${escapeHtml(spokenLetters)}">
            ${[...target.word].map((letter) => `
              <span class="recap-letter">${escapeHtml(letter)}</span>
            `).join("")}
          </div>
        </div>
      `;

      const letters = [...roundCard.querySelectorAll(".recap-letter")];
      const recapWord = roundCard.querySelector(".letter-recap-word");
      const stages = [
        (next) => playEffect("sayandspell", next),
        (next) => playWordForRecap(target.word, next),
        (next) => playSpellingPass(target, letters, expectedViewVersion, next),
        (next) => animateRecapWord(recapWord, "tornado", 1550, expectedViewVersion, next),
        (next) => playEffect("again", next),
        (next) => playWordForRecap(target.word, next),
        (next) => playSpellingPass(target, letters, expectedViewVersion, next),
        (next) => playWordForRecap(target.word, next),
        (next) => animateRecapWord(recapWord, "rolling", 1650, expectedViewVersion, next),
        (next) => playEffect("onemoretime", next),
        (next) => playWordForRecap(target.word, next),
        (next) => playSpellingPass(target, letters, expectedViewVersion, next),
        (next) => playWordForRecap(target.word, next)
      ];
      let stageIndex = 0;

      const runNextStage = () => {
        if (viewVersion !== expectedViewVersion) return;
        if (stageIndex >= stages.length) {
          const finishSequence = () => {
            window.setTimeout(() => {
              if (viewVersion === expectedViewVersion) renderWordSuccess(target, masteryResult);
            }, 150);
          };
          if (finishedLevel) {
            playEffect("win", finishSequence);
          } else {
            finishSequence();
          }
          return;
        }

        const stage = stages[stageIndex];
        stageIndex += 1;
        stage(() => {
          if (viewVersion === expectedViewVersion) runNextStage();
        });
      };

      keyAudio.pause();
      keyAudio.onerror = null;
      audio.pause();
      audio.onended = null;
      audio.onerror = null;
      playEffect("correct", () => {
        if (viewVersion === expectedViewVersion) runNextStage();
      });
    }

    function checkAnswer(answer) {
      if (locked) return;
      const target = currentWord();

      if (answer.toLowerCase() === target.word) {
        locked = true;
        const masteryResult = advanceAfterCorrect(target.word);
        const finishedLevel = currentRound() >= state.orders[state.level].length;
        saveState();
        const feedback = document.getElementById("feedback");
        if (feedback) {
          feedback.textContent = "You got it!";
          feedback.className = "feedback good";
        }
        const successViewVersion = viewVersion;
        showLetterRecap(target, masteryResult, successViewVersion, finishedLevel);
      } else {
        recordIncorrectAttempt();
        const card = document.getElementById("roundCard");
        const feedback = document.getElementById("feedback");
        feedback.textContent = "Almost! Try another word.";
        feedback.className = "feedback try";
        card.classList.remove("shake");
        void card.offsetWidth;

// Mini games deliberately keep their own state and never update quest progress.
const MINI_GAMES = [
  ['vowels', '🔵', 'Vowels & Consonants', 'Color vowels blue and consonants red.'],
  ['rhymes', '🎵', 'Rhyming Words', 'Explore words with matching ending sounds.'],
  ['bubble', '🫧', 'Bubble Letters', 'Give big bubble letters a splash of color.'],
  ['rainbow', '🌈', 'Rainbow Write', 'Write each letter with your finger in a new color.'],
  ['capitals', '🔠', 'Capital Letters', 'Copy your word in BIG letters.'],
  ['dots', '✏️', 'Connect the Dots', 'Trace the dotted letters with your finger.'],
  ['pyramid', '🔺', 'Pyramid Words', 'Build your word one letter at a time.'],
  ['picture', '🎨', 'Picture It', 'Draw a picture and give it a word label.']
];
const MINI_COLORS = [['#2563eb', 'Blue'], ['#dc2626', 'Red'], ['#16a34a', 'Green'], ['#9333ea', 'Purple'], ['#d97706', 'Orange'], ['#db2777', 'Pink']];
const MINI_RHYMES = {
  yelled: ['held', 'spelled', 'smelled'], yanked: ['banked', 'thanked', 'ranked'],
  slumped: ['bumped', 'dumped', 'jumped'], limped: ['crimped'],
  plopped: ['popped', 'hopped', 'stopped'], smiled: ['child', 'wild', 'mild'],
  shrugged: ['hugged', 'tugged', 'plugged'], liked: ['hiked', 'biked', 'spiked'],
  patted: ['batted', 'chatted', 'matted'], you: ['blue', 'shoe', 'two']
};
const miniWordRuns = {};
let miniWordIndex = 0;
let miniColor = MINI_COLORS[0][0];
let miniDrafts = {};
let miniDrawingCleanup = null;
const miniLetterAudio = new Audio();
let miniLetterQueue = [];
let miniSoundVersion = 0;
let miniLetterPlaying = false;

function nextMiniWord(id) {
  const run = miniWordRuns[id] || (miniWordRuns[id] = { remaining: [], current: null, count: 0 });
  if (!run.remaining.length) {
    run.remaining = shuffled(WORDS.map((_, index) => index));
    if (run.remaining[0] === run.current) [run.remaining[0], run.remaining[1]] = [run.remaining[1], run.remaining[0]];
    run.count = 0;
  }
  run.current = run.remaining.shift();
  run.count += 1;
  return run.current;
}

function miniLetterSound(value) {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  miniLetterQueue.push(...String(value).toLowerCase().replace(/[^a-z]/g, ''));
  if (miniLetterPlaying) return;
  const version = miniSoundVersion;
  const next = () => {
    if (version !== miniSoundVersion) return;
    const letter = miniLetterQueue.shift();
    if (!letter) { miniLetterPlaying = false; return; }
    miniLetterPlaying = true;
    let settled = false;
    const finish = () => { if (settled) return; settled = true; next(); };
    miniLetterAudio.onended = finish;
    miniLetterAudio.onerror = finish;
    miniLetterAudio.src = `sounds/letters/${letter}.mp3`;
    miniLetterAudio.play().catch(finish);
  };
  audio.pause();
  next();
}

function playMiniRecording(word, rhyme = false) {
  miniSoundVersion += 1; miniLetterQueue = []; miniLetterPlaying = false; miniLetterAudio.pause();
  stopAllAudio();
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  const fallback = () => {
    if ('speechSynthesis' in window) window.speechSynthesis.speak(new SpeechSynthesisUtterance(word));
    else miniMessage('You can still play with the word shown here.');
  };
  audio.src = `sounds/${rhyme ? 'rhymes' : 'words'}/${word}.mp3`;
  let settled = false;
  const fail = () => { if (settled) return; settled = true; fallback(); };
  audio.onerror = fail;
  audio.play().catch(fail);
}

function leaveMiniView() {
  document.body.classList.remove('in-mini-games');
  miniSoundVersion += 1; miniLetterQueue = []; miniLetterPlaying = false;
  miniLetterAudio.pause(); miniLetterAudio.onended = null; miniLetterAudio.onerror = null;
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  if (miniDrawingCleanup) miniDrawingCleanup();
  miniDrawingCleanup = null;
  stopAllAudio();
  viewVersion += 1;
  document.querySelector('.correction-backdrop')?.remove();
  document.querySelector('.level-switcher-backdrop')?.remove();
}

function renderMiniBoard() {
  leaveMiniView();
  document.body.classList.add('in-mini-games');
  updateHeader(false);
  screen.innerHTML = `<div class="card mini-board">
    <p class="eyebrow">A little spelling break</p><h1>Pick & Play</h1>

    <div class="mini-grid">${MINI_GAMES.map(([id, icon, name, description]) => `<button class="mini-tile" data-mini="${id}"><span class="mini-icon" aria-hidden="true">${icon}</span><strong>${name}</strong><small>${description}</small></button>`).join('')}</div>
    <div class="mini-actions mini-footer"><button class="secondary-button" id="miniMain">Back to the three levels</button></div>
  </div>`;
  screen.querySelectorAll('[data-mini]').forEach(button => button.addEventListener('click', () => renderMiniGame(button.dataset.mini)));

function miniPalette(colors = MINI_COLORS) {
  return `<div class="mini-palette" role="group" aria-label="Choose a color">${colors.map(([color, name]) => `<button class="mini-swatch" style="background:${color}" data-color="${color}" aria-label="${name}" aria-pressed="${miniColor === color}"></button>`).join('')}</div>`;
}

function wireMiniPalette() {
  screen.querySelectorAll('[data-color]').forEach(button => button.addEventListener('click', () => {
    miniColor = button.dataset.color;

function renderMiniGame(id) {
  leaveMiniView();
  document.body.classList.add('in-mini-games');
  updateHeader(false);
  const game = MINI_GAMES.find(item => item[0] === id);
  miniWordIndex = miniWordRuns[id]?.current ?? nextMiniWord(id);
  const word = WORDS[miniWordIndex].word;
  const key = `${id}:${word}`;
  const draft = miniDrafts[key] || (miniDrafts[key] = {});
  let body = '';
  let instruction = game[3];
  if (['vowels', 'bubble'].includes(id)) {
    if (id === 'vowels') { miniColor = MINI_COLORS[0][0]; instruction = 'Pick blue for a, e, i, o, u. Pick red for the other letters. Then tap a letter to color it.'; }
    else instruction = 'Pick your favorite colors and tap the bubble letters to fill them in.';
    body = miniPalette(id === 'vowels' ? MINI_COLORS.slice(0, 2) : MINI_COLORS)
      + `<div class="mini-letters">${[...word].map((letter, index) => `<button class="mini-letter ${id === 'bubble' ? 'bubble' : ''}" data-letter="${index}" aria-label="Letter ${index + 1}: ${letter}, ${MINI_COLORS.find(c => c[0] === draft.colors?.[index])?.[1] || 'uncolored'}" ${draft.colors?.[index] ? `style="color:${draft.colors[index]}"` : ''}>${letter}</button>`).join('')}</div>`;

  } else if (id === 'capitals') {
    instruction = 'Look at the big letters and copy them. Your keyboard letters will turn into capitals.';
    body = `<div class="mini-word">${word.toUpperCase()}</div><label class="mini-draw-label" for="miniWriting">Write in capital letters</label><input class="mini-text mini-capitals" id="miniWriting" autocomplete="off" autocorrect="off" spellcheck="false" value="${escapeHtml(draft.text || '')}" placeholder="COPY HERE"><div class="mini-actions"><button class="secondary-button" id="miniCheck">Take a look</button></div>`;
  } else if (id === 'pyramid') {

  } else {
    const letterMode = id === 'dots' || id === 'rainbow';
    draft.letterIndex ||= 0;
    if (id === 'rainbow') miniColor = MINI_COLORS[draft.letterIndex % MINI_COLORS.length][0];
    instruction = id === 'dots' ? 'Connect a few big dots to make each letter. One letter at a time.' : id === 'rainbow' ? 'Write over each letter with your finger. Each new letter gets a new rainbow color.' : 'What does this word make you think of? Draw it, then add your label.';
    body = `<div class="mini-word">${letterMode ? [...word].map((letter,index) => `<span class="${index === draft.letterIndex ? 'mini-current-letter' : ''}">${letter}</span>`).join('') : word}</div>${letterMode ? `<p class="mini-hint">Letter ${draft.letterIndex + 1} of ${word.length}: <strong>${word[draft.letterIndex]}</strong></p>` : ''}${miniPalette()}<canvas class="mini-paper ${letterMode ? 'mini-letter-paper' : ''}" id="miniPaper" aria-label="${id === 'dots' ? 'Connect the letter dots' : id === 'rainbow' ? 'Finger writing area' : 'Drawing area'}"></canvas><p class="mini-hint">Use your finger or an Apple Pencil.</p><div class="mini-actions"><button class="secondary-button" id="miniClear">Clear</button>${letterMode ? `<button class="primary-button" id="miniNextLetter">${draft.letterIndex === word.length - 1 ? 'Finish word' : 'Next letter →'}</button>` : ''}</div>${id === 'picture' ? `<label class="mini-draw-label" for="miniWriting">Label your picture</label><input class="mini-text" id="miniWriting" autocomplete="off" value="${escapeHtml(draft.text || '')}" placeholder="${word}">` : ''}`;
  }
  screen.innerHTML = `<div class="card mini-board ${['dots','rainbow'].includes(id) ? 'mini-writing-mode' : ''}"><div class="mini-toolbar"><button class="secondary-button" id="miniBack">← Mini Games</button><h2>${game[1]} ${game[2]}</h2></div><div class="mini-word-nav"><span>Word ${miniWordRuns[id].count} of ${WORDS.length}</span><button class="sound-button" id="miniHear">Hear word</button></div><p class="mini-hint">${instruction}</p>${body}<p class="mini-note" id="miniNote" role="status"></p><div class="mini-actions mini-footer"><button class="primary-button" id="miniNext">Next word →</button><button class="secondary-button" id="miniDone">Done for now</button></div></div>`;
  document.getElementById('miniBack').onclick = renderMiniBoard;
  document.getElementById('miniDone').onclick = renderMiniBoard;
  const advanceWord = () => { nextMiniWord(id); renderMiniGame(id); };
  document.getElementById('miniNext').onclick = advanceWord;
  document.getElementById('miniHear').onclick = () => playMiniRecording(word);
  const nextLetter = document.getElementById('miniNextLetter');
  if (nextLetter) nextLetter.onclick = () => {
    if (draft.letterIndex === word.length - 1) { draft.letterIndex = 0; advanceWord(); }
    else { draft.letterIndex += 1; renderMiniGame(id); }
  };
  wireMiniPalette();
  screen.querySelectorAll('[data-letter]').forEach(button => button.onclick = () => {
    const index = Number(button.dataset.letter);

    draft.colors[index] = miniColor;

    button.style.color = miniColor;
    button.setAttribute('aria-label', `Letter ${index + 1}: ${word[index]}, ${MINI_COLORS.find(c => c[0] === miniColor)[1]}`);
    if (id === 'vowels') {
      const vowel = /[aeiou]/.test(word[index]);
      miniMessage((vowel ? miniColor === '#2563eb' : miniColor === '#dc2626') ? `${word[index]} is a ${vowel ? 'vowel — blue!' : 'consonant — red!'}` : `Try ${vowel ? 'blue for this vowel' : 'red for this consonant'}. You can tap it again.`);

  const writing = document.getElementById('miniWriting');
  if (writing) writing.oninput = event => {
    const previous = draft.text || '';
